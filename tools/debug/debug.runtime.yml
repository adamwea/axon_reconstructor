# Debug runtime configuration for axon reconstructor.
# This file is meant to be used in conjunction with debug.data.yml, which contains dataset-specific information.

# Data set config is seperated from runtime config.
data: ./debug.data.yml

env:
  python:
    # User-agnostic template path; ${HOME} expands per user.
    executable_path: ${HOME}/miniconda3/envs/axon_recon/bin/python
    # Preferred fallback when executable_path is absent on a machine.
    conda_env_name: axon_recon

resources:
  # Global fallbacks when a stage-specific resources block omits a key.
  max_workers: 24
  chunk_duration: 1s

global_logger:
  level: INFO
  format: "[%(asctime)s] %(levelname)s - %(message)s"
  debug_mode:
    enable: false
    level: DEBUG
    format: "[%(asctime)s] %(levelname)s - %(message)s (%(pathname)s:%(funcName)s:%(lineno)d)"

global_heatmap_defaults:
  # Shared defaults for heatmap-like plots across templates and reconstruct/recon.
  # Stage/output blocks can override any of these values and add plot-specific keys as needed.
  default:
    background: black
    color_map: viridis
    color_bar:
      show: true
      location: topright
      fontsize: 6
      fontcolor: white
      low_color: blue
      mid_color: white
      high_color: red
      length_fraction: 0.3
      pad_fraction: 0.02
      force_low_value: 0
      force_high_value: null
      scale: linear
      percentile_low: 5.0
      percentile_high_linear: 99.0
      percentile_high_log: 99.5
      knot_anchor_values: [1.0, 10.0]
      knot_y1_min: 0.02
      knot_y1_max: 0.90
      knot_y2_min: 0.07
      knot_y2_max: 0.98
      knot_min_gap: 0.05
      linear_cap_rounding_mode: ceil_step
      linear_cap_rounding_step: 10.0
      linear_cap_min_vmax: 11.0
      show_ticks: [1, 10, dynamic_high]

stages:
  preprocess:
    execution:
      force_restart: false
      force_replot: false
    logging:
      enabled: true
      verbose: true
      # Optional custom preprocess log path. Relative paths resolve under per-well output dir.
      file_relpath: logs/preprocess_pipeline.log
      # Suppress repetitive Neo Maxwell plugin status print (opt-in).
      suppress_h5_plugin_messages: true
      # Emit high-visibility phase divider lines in terminal and preprocess log.
      phase_dividers: true
    debug:
      # Optional debug overrides for preprocess execution and outputs.
      limit_wells: null # int or null for no limit
      #limit_segments_per_well: 2 # int or null for no limit
      limit_segments_per_well: null
    plot:
      # Master preprocess PNG diagnostics override.
      # true  -> force all preprocess PNG diagnostics OFF
      # false -> force all preprocess PNG diagnostics ON
      # null/omit -> respect individual toggles below
      disable_all_png_diagnostics: true

      # Individual diagnostic toggles for more granular control. These are all independent, so you can enable any combination of them.
      layouts: true
      segment_traces: true # legacy alias for per-segment enabled flag
      # Optional explicit output roots for preprocess diagnostics.
      # Relative paths resolve under the per-well output directory.
      output_dir: preprocess_outputs
      epoch_markers_output_dir: preprocess_outputs
      assay_stats_relpath: assay_stats_{stream_id}.txt
      channel_layouts_subdir: channel_layouts
      segment_traces_subdir: segment_traces
      concat_trace_relpath: concat_cluster_reps_{stream_id}.png
      # Representative controls for concatenated trace diagnostics.
      concat_trace:
        enabled: true
        # Alias-compatible with `n_representative_channels`; set to -1 to include all representatives.
        n_reps: 3
      # Representative controls for per-segment trace diagnostics.
      per_segment_traces:
        enabled: true
        # Alias-compatible with `n_representative_channels`; set to -1 to include all representatives.
        n_reps: 2
      # Parallel workers for diagnostic plotting/scoring (segment trace rendering + representative scoring).
      n_jobs: null # inherit preprocess n_jobs by default; can set an explicit number here for more control.

      # Downsample plotting density for concat/segment trace figures.
      # Example math (10 kHz source, 30 min recording):
      #   duration_s = 30 * 60 = 1800 s
      #   raw_points_per_channel = 10000 * 1800 = 18,000,000
      #   downsampled_points_per_channel = 250 * 1800 = 450,000
      #   decimation_factor = 10000 / 250 = 40x fewer samples
      #   reduction = 1 - (250 / 10000) = 97.5% fewer points
      # Effective plotting rate is capped further by trace_max_points.
      #trace_downsample_hz: 250.0
      #trace_downsample_hz: null # when null, no downsampling is applied to trace diagnostics; use with trace_max_points
      trace_downsample_hz: 100.0 # downsample to 100 Hz for trace diagnostics; effective rate may be further reduced by trace_max_points
      trace_max_points: -1 # int or -1 for no cap
    observability:
      # off|basic|detailed; detailed captures richer metadata artifacts for debugging.
      mode: detailed
      output_subdir: run_metadata
      save_run_manifest: true
      save_event_timeline: true
      save_environment: true
      save_artifact_inventory: true
      save_stage_log: true
      stage_log_relpath: logs/preprocess_pipeline.log
    outputs:
      # Save controls for preprocessed recording artifacts.
      save_concat_recording: true
      save_segment_recordings: true
      # Shared write settings for concat and per-segment saves.
      save_chunk_duration: 1s
      save_progress_bar: false
      # Optional worker overrides (null -> inherit preprocess n_jobs).
      concat_save_n_jobs: null
      segment_save_n_jobs: null
      print_n_jobs_used: true
    resources:
      max_stage_workers: 24
      well_workers: 2

  spikesort:
    resources:
      max_stage_workers: 24
      well_workers: 2
      chunk_duration: 1s
    logging:
      enabled: true
      verbose: true
      file_relpath: logs/spikesort_pipeline.log
    execution:
      force_restart: false
      force_replot: false
      # Optional debug overrides for spikesort execution and outputs.
      limit_wells: null # int or null for no limit
      # Relative paths resolve under the per-well output directory.
      output_root: spikesort_outputs # put all outputs during spikesort stage under this subdir in each well's output directory
      delete_outputs_on_force_restart: true # sort-phase cleanup toggle (alias for phases.sort.delete_outputs_on_force_restart). When force_restart is true, removes stale sort outputs under <well>/<output_root> (for example sorter_output and analyzer_output) before rerunning sort.

      # Optional checkpoint rewind stage in MEA_Analysis (e.g. merge).
      resume_from: null
      #resume_from: merge
    inputs:
      # Relative paths resolve under the per-well output directory.
      preprocess_concat_recording_relpath: preprocess_outputs/preprocessed_recording
    phases:
      #resolve_sources:
      sort:
        enabled: true

        # Sorter Options
        sorter: kilosort4
        docker_image: adammwea/benshalomlab_spikesorter_pythonpatch:v3
        kilosort:
          batch_duration_s: 0.75
          thresholds:
            universal: 8
            learned: 7
            single_ch: 5
          clustering:
            downsampling: 15
          channels:
            nearest: 12
            max_distance: 40
        # Controls MEA_Analysis plotting behavior.
        plot:
          enabled: true
          mode: separate # separate|merged
          plot_debug: false
          raster_sort: null # e.g. unit_id|firing_rate or null
          fixed_y: false
        # Controls report/curation export behavior.
        report:
          enabled: true
          no_curation: true
          export_to_phy: false

      bombcell_label:

      merge_units:

        enabled: true # master toggle for merge phase; when false, skips the entire merge phase and any associated outputs, regardless of individual merge method settings below.

        # force restart and replot toggles for the merge phase.
        # force_restart controls whether to rerun the merge phase logic and regenerate merge outputs; when true, merge outputs are deleted before rerunning merge logic to ensure a clean slate for debugging iterations.
        # force_replot controls whether to replot merge reports and diagnostics even if merge outputs are not regenerated; when true, existing merge outputs are used to regenerate plots and reports.
        force_restart: false
        force_replot: false

        rel_output_root: merge_output # subdir under spikesort_outputs for all merge-related outputs; relative paths for merge outputs resolve under this directory in each well's output directory
        delete_outputs_on_force_restart: true # merge-phase cleanup toggle. When force_restart is true, removes stale merge outputs under <well>/<spikesort_output_root>/<merge_units.rel_output_root> before rerunning merge phase logic.
        # Canonical merge workspace mode:
        # 1) copy live sorter/analyzer outputs into a workspace under merge outputs,
        # 2) (re)build analyzer there from the copied sorter output,
        # 3) run merge methods against that workspace,
        # 4) optionally publish merged sorter/analyzer back to live stage outputs.
        use_cache_as_canonical_workspace:
          enabled: true
          canonical_workspace_relpath: cache/merge_workspace
          canonical_workspace_refresh_on_run: true
          canonical_workspace_rebuild_analyzer: true
          # Guardrails: ensure merge methods are actually consuming canonical workspace sorter outputs.
          assert_slay_uses_canonical_workspace: true
          assert_auto_merge_uses_canonical_workspace: true
          publish_to_stage_outputs_on_success: false
          publish_to_stage_outputs_on_failure: false

        pre_merge_metadata:
          # Write one consolidated merge metadata summary for quick before/after comparisons.
          # The file captures sorter and analyzer unit IDs before/after merge, applied merge groups,
          # pre/post unit mapping hints, and optional unit locations from analyzer extension data.
          enabled: true
          write_json: true
          json_relpath: pre_merge_metadata_summary.json
          include_unit_locations: true
          log_summary_details: true

        # In the event that we desire to chain automerging methods, follow this priority order when multiple are enabled:
        # 1) SLAy recommended merges (if enabled)
        # 2) Spikeinterface automerge (if enabled)
        # 3) Unitmatch (if enabled)
        sequence: [SLAy, auto_merge, unitmatch]

        # SLAy - https://github.com/saikoukunt/SLAy
        # New option that is better suited to working with incomplete templates at least.
        SLAy:
          enabled: true
          delete_outputs_on_force_restart: true # merge-method cleanup toggle for SLAy. When force_restart is true, removes only <well>/<output_root>/<SLAy.relpath> before rerunning SLAy merge.
          # Relative to spikesort.execution.output_root.
          relpath: SLAy_outputs
          # Optional local source checkout for imports when SLAy is not pip-installed.
          package_root: /home/adamm/dev/pkgs/SLAy
          # Optional explicit KS folder (relative to spikesort.execution.output_root).
          # If null, defaults to sorter_output and auto-probes nested sorter_output/.
          # sorter_output_relpath: ../sorter_output/sorter_output
          # If true and cupy is unavailable, inject a numpy-based fallback shim.
          allow_numpy_fallback: true
          # Copy SLAy automerge artifacts from KS folder into this stage output dir.
          copy_automerge_artifacts: true
          # Keep false by default: we only want candidate outputs, not direct KS cluster rewrites.
          auto_accept_merges: true
          # NOTE: upstream SLAy only emits automerge/merges plots when auto_accept_merges is false.
          # Keep false by default to avoid plotting overhead for debug iterations.
          plot_merges: true
          # Stage-managed output artifact names.
          output_json_relpath: run-output.json
          candidate_pairs_relpath: recommended_merge_candidates.tsv
          merge_groups_relpath: recommended_merge_groups.json

          # Optional SLAy model-cache controls.
          # These knobs govern the cache under merge outputs (for example cache/slay_model/ae.pt).
          model_cache:
            enabled: true
            # When true, reuse an existing cached model file if present.
            use_cached_model: true
            #use_cached_model: false # keep false by default to ensure fresh training iterations during debugging, but can be set to true to speed up iterations when model training is not the focus.
            # When true, allow SLAy to write/update the cached model file.
            write_model_cache: true
            # Relative to merge output root.
            relpath: cache/slay_model/ae.pt

          # If true and force_restart is enabled for merge phase/SLAy, delete the selected model path
          # before running so SLAy retrains from scratch.
          force_restart_retrain_model: false

          # Optional passthrough params for slay.run_slay.
          # Values below mirror SLAy RunParams defaults so you can tweak them explicitly.
          # Note: KS_folder and output_json are managed by this pipeline wrapper.
          # Note: auto_accept_merges / plot_merges are controlled by top-level SLAy keys above.
          params:
            dtype: int16
            pre_samples: 20
            post_samples: 62
            #min_spikes: 100
            min_spikes: 50
            #max_spikes: 500
            max_spikes: -1
            #good_lbls: [good] # Only these KS labels are treated as valid units for SLAy similarity/merge candidate scoring.
            good_lbls: [good, mua] # include unsorted units as candidate participants in SLAy merges by treating them as valid units for similarity/merge candidate scoring; keep false by default to focus on merges between well-isolated units during debugging iterations, but can be set to true to explore potential merges involving unsorted units.

            window_size: 0.1
            xcorr_bin_width: 0.0005
            overlap_tol: 0.00016666666666666666 # 5 / 30000
            min_xcorr_rate: 800
            xcorr_coeff: 0.25

            ref_pen_bin_width: 1
            max_viol: 0.15
            ref_pen_coeff: 1

            spikes_path: null
            model_path: null
            sim_thresh: 0.4
            # Autoencoder embedding window/control knobs used by SLAy similarity scoring.
            ae_pre: 10 # samples before spike center used in AE input window
            ae_post: 30 # samples after spike center used in AE input window
            ae_chan: 8 # number of local channels included in AE input tensor
            #ae_chan: 10
            #ae_noise: false # purpose: noise augmentation for AE embeddings/training. ON can improve robustness to noisy waveforms and amplitude variation; OFF is faster and usually more repeatable for debugging.
            ae_noise: true
            ae_shft: false # purpose: temporal-shift augmentation for AE embeddings/training. ON can improve tolerance to spike-alignment jitter; OFF is faster and keeps embeddings more timing-sensitive.
            #ae_epochs: 25 # training epochs when SLAy needs to train/fine-tune the AE model
            ae_epochs: 50
            #ae_epochs: 10 # reduced for debugging iterations; can increase for more thorough training in non-debug runs.

            final_thresh: 0.5
            max_dist: 10
            #auto_accept_merges: false
            auto_accept_merges: true
            plot_merges: true

          # recompute analyzer after applying merges recommended by SLAy.
          # i think merges applied by SLAy are applied to the sorting object directly,
          # so the analyzer might be out of date after the merges are applied,
          # which could lead to inconsistencies between the merged sorting and the analyzer outputs that are used for downstream template building and plotting.
          recompute_analyzer: true # whether to trigger a rerun of the analyzer after applying merges recommended by SLAy; keep false by default to avoid the overhead of repeated analyzer runs during merge debugging iterations.

        # Automerge via Spikeinterface built in automerge method.
        # Pretty straight forward. This is the Spikeinterfaces recommended way of doing template matching
        # I don't like this though because we're basically matching based on incomplete templates.
        # I'd prefer to do something like this in the templates stage when we have the more fully formed templates to work with,
        # but this is a start and we can iterate on it.
        # TODO: this might be broken for now.
        auto_merge:
          enabled: false
          template_diff_thresh: 0.05,0.15,0.25
          relpath: automerge_outputs
          delete_outputs_on_force_restart: true # merge-method cleanup toggle for auto_merge. When force_restart is true, removes only <well>/<output_root>/<auto_merge.relpath> before rerunning auto_merge.
          candidate_pairs_reldir: recommended_merge_candidates
          merged_units_reldir: merged_units
          # Note: This autoaccepts merges at each threshold level, so recommended merges may not clearly
          # describe the incremental effect of new merged templates appearing in the analyzer with each threshold auto_accepted
          # Use with caution for debugging and consider setting auto_accept_merges to false and inspecting candidate pairs manually in that case.
          auto_accept_merges: true # whether to automatically apply merges recommended by the spikeinterface automerge method, which can be a bit aggressive and lead to over-merging if left on without manual review, so keep false by default for debugging iterations.

        # Experimental, auto-merge using unitmatch in a way it isn't really designed for.
        # moreover, the model behind it isnt trained on this kind of data, so results may be unreliable and should be taken with a grain of salt.
        # TODO: refine this, and potentially train a custom model on simulated MEA data with known ground truth to improve performance and reliability for this use case.
        unitmatch:
          enabled: false
          merge_units: false
          dry_run: false
          output_subdir_name: unitmatch_outputs
          throughput_subdir_name: unitmatch_throughput
          max_spikes_per_unit: -1
          oversplit_min_probability: 0.95
          limits:
            # max_candidate_pairs: 20000
            # oversplit_max_suggestions: 2000
            max_candidate_pairs: -1
            oversplit_max_suggestions: -1
          apply_merges: false
          recursive: false
          iterations:
            #max: 5
            max: -1
            keep_all: false

        post_merge_metadata:
          # Write one consolidated post-merge metadata summary for quick comparisons with the pre-merge summary.
          enabled: true
          write_json: true
          json_relpath: post_merge_metadata_summary.json
          include_unit_locations: true
          log_summary_details: true

        # merge reports
        reports:
          enabled: true

          # json report summarizing unit diffs after merge
          # includes unit-level metadata before/after merge, merge groups, and generally data that can be used for
          # 2 panel unit location plots and other merge diagnostics.
          unit_diff_json:
            enabled: true
            relpath: unit_diffs_after_merge.json

          # operation-level merge lineage map (includes chained merge edges).
          unit_diff_map:
            enabled: true
            relpath: unit_diff_map.json

          # flattened merge lineage map (merged-participant units only).
          unit_diff_map_flat:
            enabled: true
            relpath: unit_diff_map_flat.json

          # post-merge unit locations serialized directly from post-merge analyzer snapshot.
          post_merge_unit_locations:
            enabled: true
            relpath: post_merge_unit_locations.json

          # xy view of unit locations before and after merge, with lines connecting units that were merged together.
          # Useful for visually assessing the spatial relationships between merged units and the overall effect of the merge on unit locations.
          2panels_unit_locations_before_after_merge:
            enabled: true
            # scatter point size in points^2 (matplotlib scatter s parameter).
            # slightly smaller than previous default to reduce overlap in dense wells.
            point_size: 2
            highlight_merges:
              enabled: true
              # units that would become the merged unit in the before plot
              # and units that are the result of merging in the after plot are highlighted in the same color to visually link them.
              linked_highlight: true
              # used when linked_highlight is false
              before_color: "#ff7f0e"
              after_color: "#2ca02c"
              # used when linked_highlight is true
              palette: tab20

              #jic affected units get burried under other scatter points, deliberately plot them after the other units so they appear on top and are more visible.
              plot_after_other_units: true

              #jic affected units are hard to find. Optionally label only the units affected by the merge with their unit IDs in the before and after plots to make them easier to track visually;
              # keep false by default to reduce visual clutter, but can be set to true for debugging iterations to provide more information in the plots.
              label_affected_units: true
            # inherit probe dimensions specified in data.yml if available.
            # this can control relative size of electrodes if plotted, xy extent of the plots, and the scaling of location markers if point_size is not explicitly set here.
            inherit_probe_dimensions: true

            # Get xy extent for affected units before and after.
            # take the largest x and y extent of both
            # apply that zoom to both panels to better visualize the units affected by the merge and their spatial relationships.
            zoom_to_affected_units: true
            label_pre_and_post_units: false # whether to label units with their pre-merge IDs in the before plot and post-merge IDs in the after plot, which can help visually track how individual units are affected by the merge; keep true by default for debugging iterations to provide more information in the plots, but can be set to false to reduce visual clutter if there are many units.
            assets:
              before:
                write_png: true
                write_svg: false
                relpath: unit_locations_before_merge.png
                point_color: "#7a7a7a"
              after:
                write_png: true
                write_svg: false
                relpath: unit_locations_after_merge.png
                point_color: "#7a7a7a"
            write_png: true
            write_svg: false
            relpath: unit_locations_before_after_merge.png

            # Presence ratio
            # rp_contamination
            # firing_rate
            # amplitude median


  templates:
    resources:
      max_stage_workers: 24
      well_workers: 2

    execution:
      debug: false
      force_restart: false
      force_replot: false
      force_rereport: false

      # Do not load segments or rebuild templates.
      # Just force replotting of existing templates from disk. Useful for iterating on plot formatting without having to rebuild templates.
      force_replot_per_unit: false #TODO: Make sure this is wired up

      # If true, will only build templates for units that have been manually curated by MEA_Analysis during waveforms stage.
      require_curated_units: false

      # limit number of unit templates to build for debugging purposes. Set to -1 or null for no limit.
      unit_limit: -1
      #unit_limit: 10

      # Optional explicit unit subset for fast, deterministic reruns.
      #unit_ids: [1, 3, 7, 10, 17, 20, 22, 23, 24, 28]

    inputs:
      # Input path handling (paths are resolved relative to the per-well output root when using leading '/').
      # 1) If concat_analyzer_relpath is loadable, it is used directly for concat waveforms/templates.
      # 2) Otherwise, concat analyzer is built from concat_sorting_relpath + preprocessed_concat_reldir.
      # 3) Segment sources are discovered under preprocessed_segments_reldir.
      #    - If child dirs are analyzers, they are loaded directly.
      #    - If child dirs are preprocessed recordings, segment analyzers are built from concat sorting windows.
      preprocessed_segments_reldir: /preprocess_outputs/per_segment_preprocessed
      preprocessed_concat_reldir: /preprocess_outputs/preprocessed_recording
      concat_sorting_relpath: /spikesort_outputs/sorter_output
      concat_analyzer_relpath: /spikesort_outputs/analyzer_output

    phases:
      # WIP Refactoring to stage phases.
      resolve_sources:
        enabled: true
        show_header: true # whether to show a header for this phase in the logs, which can help visually separate it from other phases and identify it quickly when scanning logs.
        log_candidates: false # Log each candidate path considered per source category.
        check_path_exists: true # Include existence checks in logs and summaries for candidate paths.
        include_alternate_well_dirs: false # Probe alternate output roots (for example output_root_2) in addition to the primary well output root.
        probe_curated_units: false # If require_curated_units is true and unit_ids is unset, probe curated-unit availability during resolve.
        max_candidates_per_source: 12 # Cap logged/serialized candidate paths per source category.
        fail_if_required_sources_missing: false # Optional strict mode for debugging source requirements before running heavier phases.
        write_json: true # Optional write of resolve summary JSON under templates output root.
        json_relpath: context/resolve_sources_summary.json
      # create_sorting_analyzers:
      # per_unit_processing:
      #   extract_template_segments:
      #   build_templates:
      #     handle_merge_overlaps:
      # finalize:



    output_rel_root: template_outputs
    spikeinterface:
      waveform_extraction:
        window:
          ms_before: 2
          ms_after: 5
        # null or -1 means uncapped (use all available spikes per unit per source)
        max_spikes_per_unit: -1
        sources:
          include_concat: true
          include_segments: true

      template_extraction:
        sources:
          include_concat: true
          include_segments: true
          # Enforce both sources when include_* is true: fail instead of silently running concat-only.
          require_concat: true
          require_segments: true

    upsampling:
      enable: true
      method: sinc
      factor: 10
      mismatch_tolerance_hz: 0.5
      raw_rate_fallback_hz: null # optional fallback when raw recording rate cannot be read

    merge:
      enable: true
      # mean_all_waveforms: merge all overlapping source waveforms equally (v1 behavior)
      # weighted_by_channel_waveform_count: weighted average by per-source waveform count at overlapping channels
      method: mean_all_waveforms
      centering_method: pre_peak_robust_baseline # TODO: validate methods here
      #max_waveforms_per_source_channel: 500
      max_waveforms_per_source_channel: -1
      overlap_match_priority: [electrode_id, location]
      location_tolerance_um: 1.0

    quality_checks:
      enable: true
      suppress_warnings: true
      multiple_peaks_at_channel_templates:
        enable: true
        prominence_fraction: 0.30
        min_separation_samples: 8
        # Recommended: 2 for strict AP-only detection, 3 if you want a more permissive screen.
        max_peaks_per_channel: 2
        plot_violations: true

    analysis:
      propagation_ordering:
        enable: true
        latency_mode: negative_peak # abs_peak or negative_peak; controls canonical channel ordering metric.
        latency_tie_breaker: channel_index # channel_index (default) sorts equal-latency ties by channel number; stable keeps selected/input order.
        debug: true # emit per-unit canonical/window/anchor/label-range diagnostics in logs.

    # All outputs from templates stage
    outputs:
      output_rel_root: template_outputs
      analyzer_cache:
        enabled: true
        #relpath: cache/analyzers
        relpath_root: cache/analyzers
        concat_analyzer_subdir: concat
        segment_analyzers_subdir: segments
        cleanup_on_success: false
      data_outputs:
        quality_checks:
          multiple_peaks_at_channel_templates:
            write_json: true
            json_relpath: multiple_peaks_at_channel_templates.json

      per_unit_outputs:

        # Base rel dir for all outputs for a given unit. Can be formatted with {unit_id} if desired,
        # but should not include file name or extension components since those are specified separately for each output type below.
        unit_reldir: units/{unit_id:04d}/

        ## Per-Unit Data Artifacts

        # quality_checks: structured data outputs related to quality checks performed on the templates,
        # which can include information about any detected issues or violations of quality criteria, such as multiple peaks at channel templates,
        # signal-to-noise ratio assessments, or other relevant metrics.
        # These outputs can be used for filtering units based on quality criteria or for further analysis of template quality across the dataset.
        # The specific structure and content of these quality check outputs can be defined based on the needs of the analysis and the types of quality assessments being performed.
        quality_checks:
          # multiple_peaks_at_channel_templates: information about any channels in the template that have multiple peaks in their waveforms,
          # which can be an indicator of potential issues with the template such as overlapping units or noise contamination.
          multiple_peaks_at_channel_templates:
            write_json: true
            json_relpath: multiple_peaks_at_channel_templates.json
            plot:
              write_png: true
              write_svg: false
              relpath: multiple_peaks_at_channel_templates
              show_multiple_peak_markers: true # when true, draw all detected negative peaks for each violating channel.
              delay_peak_marker_color: red # color used for the peak selected for delay ordering/latency calculations.

        # merged_template: the final merged template waveform for the unit, typically averaged across all segments and/or concatenated segments.
        # This is the main data artifact representing the spatial footprint and waveform shape of the neuron across the MEA channels, and is used for downstream analyses and plotting.
        # Will usually be sparse. Should only contain channel / electrodes non-zero signal in the template in at least one template source (segments and / or concat)
        merged_template:
          write_npy: true # Usually it's enough to write the merged_template. square, scan, and/or full templates can be derived as needed downstream.
          npy_relpath: merged_template.npy
          channel_locations_npy_relpath: merged_channel_locations.npy

        # square_template: a version of the merged template that has been padded to have a square channel layout, with dimensions equal to the max spatial extent of the template
        # across x and y.
        # padding can be zeros, ones, or nans as specified in square_template_padding_value.
        # This can be useful for certain types of analyses or plotting that require a rectangular input format, while still preserving the spatial relationships between channels.
        square_template:
          write_npy: false
          npy_relpath: square_template.npy
          channel_locations_npy_relpath: square_channel_locations.npy
          padding_value: zero # zero, one, or nan

        # scan_template: a version of the merged template that includes all electrodes present in the source recording data across all segments.
        # Dimensions are determined by the full spatial extent of the MEA channels present in the recording, which may be larger than the spatial extent of the template signal itself.
        # Padded with zeros, ones, or nans as specified in scan_template_padding_value for channels that are not part of the template.
        scan_template:
          write_npy: false
          npy_relpath: scan_template.npy
          channel_locations_npy_relpath: scan_channel_locations.npy
          padding_value: zero # zero, one, or nan

        # full_template: a version of the merged template that includes all electrodes present in the full probe, including channels that were not explicitly recorded in the source data
        # but are present in the MEA layout. By default, we assume the full probe layout corresponds to the maxone and maxtwo channel coordinates in the template locations,
        # but this can be overridden by specifying a custom full probe layout in the data config.
        # Copied from debug.data.yml for reference.
        # Probe: # https://www.mxwbio.com/products/maxtwo
        #   brand: maxwell
        #   device: maxtwo_HDMEA
        #   plate_format: 6-well
        #   # Per-well active sensing area (used for geometry-aware channel layout plotting).
        #   active_sensing_area_mm:
        #     x: 3.85
        #     y: 2.10
        #     z: null
        #   electrodes_per_well: 26400
        #   # Keep for future runtime checks and resampling defaults.
        #   sampling_rate_hz: 10000
        #   pitch_um: 17.5
        #   electrode_size_um:
        #     x: 12.0
        #     y: 8.8
        full_template:
          write_npy: false
          npy_relpath: full_template.npy
          channel_locations_npy_relpath: full_channel_locations_xy.npy
          padding_value: zero # zero, one, or nan

        ## Per-Unit Plots
        # Template plot - plot of the spatial footprint of the template waveforms across the MEA channels,
        # showing the waveform shapes on each channel as well as the relative amplitudes across channels. Useful for assessing template quality and spatial distribution.
        template_plots:
          waveforms:
            output:
              write_png: true
              write_svg: false
              relpath: template_waveforms
            # Full-template channel scope:
            # - contributing_channels: only channels with non-zero template signal.
            # - recorded_channels: only channels that were actually recorded in the source data.
            # - all_channels: all channels present in full template locations - i.e. all channels physically present on the MEA regardless of whether they had signal or were recorded.
            display:
              channel_scope: contributing_channels
              force_center_soma: false # force the soma to be centered in the template plot, even if the spatial distribution of the channels would suggest an off-center location.
              force_square_aspect: true # increase template plot size to make it square (with padding) regardless of the spatial distribution of the channels.
              show_scale_bar: true
              scale_bar:
                text_offset_frac: 0.02 # move label closer/farther from bar in axis-height fractions
                y_offset_frac: 0.06 # vertical offset of bar from lower edge in axis-height fractions
                fontsize: 18
                linewidth: 1.8
                #length_um: null # optional fixed bar length; when null uses auto 50/100 um
            render:
              background: black
              signal_color: white
              scale_bar_color: white
            unit_id_label:
              show: true
              fontsize: 14
              color: white
              x_offset_frac: 0.02
              y_offset_frac: 0.02
              horizontal_alignment: right
              vertical_alignment: top
            show_axes: false
            center_most_channel_coords:
              show: true # whether to show coordinate labels centered on the most central channel in the template, which can help with orienting the template relative to the MEA layout.
              fontsize: 10
              color: white
              x_offset_frac: 0.02
              y_offset_frac: 0.02
              horizontal_alignment: right
              vertical_alignment: top

          circles:
            output:
              write_png: true
              write_svg: true
              dpi: 420
              relpath: template_circles
            display:
              channel_scope: contributing_channels
              force_center_soma: false # force the soma to be centered in the template plot, even if the spatial distribution of the channels would suggest an off-center location.
              force_square_aspect: true # increase template plot size to make it square (with padding) regardless of the spatial distribution of the channels.
              show_scale_bar: true
              show_scale_circle: true
              size_by: amplitude # amplitude or latency; if amplitude, channel circle sizes are scaled by the relative amplitude of the template on each channel. If latency, channel circle sizes are scaled by the relative latency of the template on each channel.
              color_by: latency # amplitude or latency; if amplitude, channel colors are determined by the relative amplitude of the template on each channel. If latency, channel colors are determined by the relative latency of the template on each channel.
              scale_bar:
                text_offset_frac: 0.02 # move label closer/farther from bar in axis-height fractions
                horizontal_alignment: right
                vertical_alignment: bottom
                y_offset_frac: 0.015 # vertical offset of bar from lower edge in axis-height fractions
                x_offset_frac: 0.02 # horizontal offset of bar from left edge in axis-width fractions
                x_offset_considers_fontsize: true # when true, x_offset also reserves horizontal room for the scale-bar label text width at current font size.
                fontsize: 25
                linewidth: 6
                #length_um: null # optional fixed bar length; when null uses auto 50/100 um

              #circle in top right corner showing the scale to amplitude values (
              # e.g. how big a circle with amplitude equal to the max template amplitude would be);
              # can help visually interpret circle sizes in the plot.
              scale_circle:
                diameter: equal_to_max_amplitude # can be equal_to_max_amplitude or fixed_value
                linewidth: 3
                linestyle: solid
                fontsize: 15
                horizontal_alignment: left
                vertical_alignment: top
                x_offset_frac: 0.02
                y_offset_frac: 0.005
                font_location: right # inside or outside the circle
                digits_after_decimal: 1 # number of digits after decimal point in scale circle label; set to 0 for integer formatting.

                # only applies if font_location is inside; if the scale circle diameter is smaller than this fraction of the axis width, will move the label outside the circle for better readability.
                font_location_circle_too_small: below # when font_location is inside, if the scale circle diameter is smaller than this fraction of the axis width, will move the label outside the circle for better readability.

                units: "µV" # label for scale circle units; can be empty string if no units desired.

            render:
              background: black
              signal_color: white
              scale_bar_color: white
              scale_circle_color: white
            color_bar:
              units: "ms" # label for color bar units
              title: "Latency (ms)" # title to show above color bar; if empty string, no title is shown and only tick labels with units are shown.
              show_axes_title: false # whether to show the "Latency (ms)" title above the color bar, or just the tick labels with units.
              show_unit_label: true # whether to show tick labels on the color bar, which include the units (e.g. "10 ms") or just the numeric value (e.g. "10")
              tick_decimal_places: 2 # controls tick label precision and dynamic 0/5-style tick density (more precision -> more candidate ticks)
              tick_target_count: 5 # optional desired number of ticks; <=0 or omitted lets renderer pick automatically
              tick_fontsize: 18 # color bar tick label font size

              # when true, forces color bar range to shift.
              # values at 0 delay and below will be in the first color range.
              # the exact color depends on the selected colormap.
              # so values 0 and below will be in that colormap's first range.
              # if there are negative values, zero will be the least
              # intense value at the transition point to higher colors.
              force_zero_and_neg_values_first_color_range: true
              # >=1.0; higher values sharpen separation around zero while
              # keeping zero fixed at the first/second color boundary.
              zero_transition_contrast: 1.5
            propagation_order_labels:
              show: false # when true, draw numeric labels on circles in propagation ordering rank.
              fontsize: 7
              color: white
              bbox_alpha: 0.30
            unit_id_label:
              show: true
              fontsize: 30
              color: white
              x_offset_frac: 0.02
              y_offset_frac: 0.00
              x_offset_considers_fontsize: true
              horizontal_alignment: right
              vertical_alignment: top
            show_axes: false
            center_most_channel_coords:
              show: true # whether to show coordinate labels centered on the most central channel in the template, which can help with orienting the template relative to the MEA layout.
              fontsize: 25
              color: white
              x_offset_frac: 0.02
              y_offset_frac: 0.00
              horizontal_alignment: left
              vertical_alignment: bottom

            # edge case overlapping in displayed elements in plot can happen.
            # easy fix, detect overlaps, increase xy range (zoom out) and replot until overlap is resolved.
            # measure xy space covered by fonts and shapes.
            # determine if same space is occupied by elements in any case.
            # if so, zoom out a bit and try again.
            overlap_controls:
              scalebar_coords_overlap_detect: true # whether to check for overlaps between scale bar and channel circles; if true, will trigger automatic zooming out until overlap is resolved or max iterations is reached.
              scalebar_colorbar_overlap_detect: true # whether to check for overlaps between scale bar and color bar; if true, will trigger automatic zooming out until overlap is resolved or max iterations is reached.
              unitid_label_channel_overlap_detect: true # whether to check for overlaps between unit ID label and channel circles; if true, will trigger automatic zooming out until overlap is resolved or max iterations is reached.
              coords_channel_overlap_detect: true # whether to check for overlaps between coordinate labels and channel circles; if true, will trigger automatic zooming out until overlap is resolved or max iterations is reached.
              scalebar_channel_overlap_detect: true # whether to check for overlaps between scale bar and channel circles; if true, will trigger automatic zooming out until overlap is resolved or max iterations is reached.
              max_overlap_check_iterations: 10 # maximum number of iterations to attempt to resolve overlaps through zooming out; if exceeded, will give up and plot with overlaps.
              scalecircle_channel_overlap_detect: true # whether to check for overlaps between scale circle and channel circles; if true, will trigger automatic zooming out until overlap is resolved or max iterations is reached.


        extremum_ch_wf_overlay:
          output:
            write_pdf: false
            pdf_relpath: extremum_ch_wf_overlay.pdf
            write_png: true
            png_relpath: extremum_ch_wf_overlay.png
          display:
            debug_mode: false # if true, will include additional debug info in the plot such as unit_id, template source, and applied upsampling factor and method, which can be useful for verifying that the correct templates are being plotted and that upsampling is being applied as expected.
            top_channels_per_template: 10
            #style: propagation # propogation or overlay.
            style: overlay # currently we have overlay implemented as the default, I want the wfs overlayed on eachother with the same x and y axis.
            show_title: false
            show_axes: false
            show_channel_labels: false
            show_top_channel_info: true
            show_waveform_count_info: true

            # whether to include an additional plot of the mean waveform across the *all* channels for each template, averaged across those channels.
            include_mean: true
            max_waveforms_to_show: 100 # number of top-channel waveforms drawn for this unit overlay; mean still uses all sampled waveforms
            waveform_sampling_mode: uniform # uniform, first, or random
            random_seed: 0 # used when waveform_sampling_mode=random; set null for non-deterministic sampling
          scale_bar:
            include: true
            color: black
            fontsize: 6
            linewidth: 1.8
            time_fraction: 0.10
            amp_fraction: 0.10
            time_label_offset_frac: 0.03
            amp_label_offset_frac: 0.02
          render:
            background: white

        footprint_plots:

          # The footprint amplitude map shows the relative amplitude of the template waveform on each channel, typically normalized to the amplitude on the main channel.
          # This can be useful for visualizing the spatial extent of the neuron's electrical footprint across the MEA and identifying potential axonal branches.
          amplitude_map:
            output:
              write_png: true
              write_svg: false
              relpath: footprint_amplitude_map
            template:
              shape: square # square, scan, or full
              padding_value: zero # zero, one, or nan; only applies if template shape is square or scan

          # The footprint latency map shows the latency of the template waveform on each channel, relative to the latency of the peak on the main channel.
          # This can be useful for assessing the spatial distribution of latencies across the MEA and identifying potential axonal propagation patterns,
          # especially when considered alongside the amplitude map.
          latency_map:
            output:
              write_png: true
              write_svg: false
              relpath: footprint_latency_map
            template:
              shape: square
              padding_value: zero

        topographical_footprints:
          amplitude:
            output:
              write_png: true
              write_svg: false
              relpath: topographical_amplitude_footprint
            template:
              shape: square
              padding_value: zero
            display:
              elevation_deg: 35
              azimuth_deg: -60
              marker_size: 14

          latency:
            output:
              write_png: true
              write_svg: false
              relpath: topographical_latency_footprint
            template:
              shape: square
              padding_value: zero
            display:
              elevation_deg: 35
              azimuth_deg: -60
              marker_size: 14

        propagation_plots:
          output:
            propagation_plot:
              write_pdf: false
              pdf_relpath: propagation_plot.pdf
              write_png: true
              png_relpath: propagation_plot.png
              write_svg: true
              png_dpi: 600
            circles_template_numbered:
              write_png: true
              write_svg: true
              relpath: propagation_right_panel
              png_dpi: 600
            propagation_2panel:
              write_png: true
              write_svg: true
              relpath: propagation_2panel
              png_dpi: 600
              layout:
                gap_fraction: 0.00 # horizontal gap between propagation and right panel, as fraction of propagation width.
                width_scale: 1.0 # scale factor applied to right panel width after height matching.
                keep_temp_svg: false # keep temporary left/right SVG files used for composition.
          display:
            show_title: false
            title_template: "Propagation traces {start}-{end} / {total}"
            title_fontsize: 9
            top_channels: 30 # num channels in window
            window_strategy: max_ptp_sum # scan channels in order. calc sum at each step. pick window with max sum.
            force_start_with_max_ptp: false # if true, rotate delay-ordered channels so the max peak-to-peak channel appears first.
            force_start_with_max_negative_peak: false # if true, prefer starting from the channel with the most negative peak; overrides max_ptp start.

            # if true, max ptp channel will be labeled zero when trace_label_mode
            #is order_index, even if it's not the first channel in the delay ordering.
            #Only applies when force_start_with_max_ptp is true.
            # if window_strategy is max_ptp_sum, wfs will often plot below and above the max ptp channel,
            # so this can be useful to keep the max ptp channel labeled as zero for reference even when it's not the first channel in the plot.
            force_min_neg_peak_index_zero: true

            ordering_latency_mode: negative_peak # abs_peak or negative_peak; controls canonical channel ordering metric.
            debug_ordering: true # emit per-unit canonical/window/anchor/label-range diagnostics in logs.
            trace_label_mode: order_index # electrode_id or order_index (order_index uses shared propagation ordering numbers).
            relative_signed_order_numbers: true # if true, numbering is relative to anchor with earlier channels negative and anchor=0.
            channels_per_panel: 512 # debug override: keep propagation-style plots on one panel when possible.
            channel_overlap: 5
          render:
            background: white
            trace_gain: 2.0
            trace_spacing: 1.0
            peak_marker_height_frac: 0.50 # relative marker height vs per-channel vertical spacing; increase for taller peak ticks
            peak_marker_linewidth: 0.5 # linewidth (pt) for peak tick marks
            show_multiple_peak_markers: false # when true, draw additional peak markers if peak_indices are provided.
            delay_peak_marker_color: black # color for the peak used in delay/latency ordering.
          labels:
            show_electrode_ids: true
            electrode_label_fontsize: 6
            electrode_label_x_offset_frac: -0.005
            electrode_label_y_offset_frac: 0.0
            electrode_label_alignment: right # left, center, or right alignment of electrode labels relative to the electrode location
            bold_max_amp_electrode_label: true # whether to bold the electrode label for the electrode with the maximum amplitude in the plot, which can help visually identify the main electrode in the propagation plot.
          scale_bar:
            show: true
            anchor_x_frac: -0.20
            anchor_y_frac: 0.09
            time_fraction: 0.075
            amp_fraction: 0.5
            force_amp_frac_to_max_amp: true # if true, will ignore the scale_bar_amp_fraction and instead set the amplitude fraction to correspond to the max amplitude across all channels in the plot, ensuring the scale bar always reflects the actual amplitude values in the plot.
            debug_max_amps_at_each_channel: false # if true, will print the max amplitude value at each channel in the debug info for the plot, which can be useful for verifying that the scale bar amplitude fraction is set appropriately relative to the actual amplitudes in the plot.
            linewidth: 1.8
            fontsize: 7
            time_label_offset_frac: 0.02
            amp_label_offset_frac: 0.01
          post_ap_abbrev:
            enabled: false # whether to abbreviate the post-peak portion of traces in the propagation plot.
            start_ms: 1.5 # start abbreviation this many ms after the negative peak on the reference electrode.
            start_samples: 10 # fallback when sampling rate is unavailable, or when ms-based start is out-of-range.
            cut_fraction: 0.80 # fraction of the post-peak tail to remove.
            min_samples_to_cut: 5 # skip abbreviation if computed cut is smaller than this.
            gap_samples: 8 # horizontal gap preserved for marker text after compression.
            marker_text: /.../ # marker drawn at the collapsed section on each trace.
            marker_fontsize: 7
            marker_y_offset_frac: 0.0 # extra vertical offset in trace-spacing fraction.

          duration_info:
            show: true # show before/after/total duration annotation.
            x_frac: 0.01 # annotation x position in axis fraction.
            y_frac: 0.01 # annotation y position in axis fraction.
            fontsize: 6
            horizontal_alignment: left
            vertical_alignment: top

          plot_layout:
            width_in: 8.0
            panel_height_in: 2.8
            extra_height_in: 1.0
            hspace: 0.35
            area_aspect_ratio: null # width/height per panel; when set, overrides panel_height_in.

      ## Reports
      reports:

        # Before this point, the last time we see and report locations is in spikesortings stage.
        # and at that point we have incomplete templates. Only info from cocat.
        # So here we iterate through each template and get location of each one
        # based on maximum_neg_peak channel in each template.
        # Collect the locations in a json file.
        # plot the chip with unit location scatter.
        # label points with unit id optionally.
        locations:
          output:
            write_json: true
            json_relpath: unit_locations.json
            write_png: true
            png_relpath: unit_locations.png
            write_svg: true
            svg_relpath: unit_locations.svg
          render:
            background: black
            chip_scatter_color: white
            chip_scatter_size: 6
            chip_scatter_alpha: 0.8
            invert_y_axis: true
            use_probe_active_area: true
            underlay_concat_channels: true
            concat_channel_scatter_color: "#8a8a8a"
            concat_channel_scatter_size: 1.8
            concat_channel_scatter_alpha: 0.25
            underlay_template_channels: false
            template_channel_scatter_size: 1.2
            template_channel_scatter_alpha: 0.35
            template_channel_colormap: tab20
          display:
            show_unit_id_labels: false
            show_original_to_current_redlines: true
            redline_color: red
            redline_alpha: 0.9
            redline_linewidth: 0.7
            unit_id_label_fontsize: 6
            unit_id_label_color: white
            unit_id_label_x_offset_frac: 0.02
            unit_id_label_y_offset_frac: 0.02
            unit_id_label_horizontal_alignment: right
            unit_id_label_vertical_alignment: top

        grids:
          sort_by: unit_id # unit_id, max_amplitude, max_ptp, or max_negative_peak, max_delay, template density
          wf_overlay_grid:
            output:
              write_pdf: false
              pdf_relpath: wf_overlay_grid.pdf
              write_png: true
              png_relpath: wf_overlay_grid.png
              write_svg: true
              svg_relpath: wf_overlay_grid.svg
              keep_temp_svg: false
              temp_svg_relpath: wf_overlay_grid__temp.svg
            render:
              mode: direct_replot
              dpi: 420
              subplot_background_color: white
              figure_background_color: white
            display:
              top_channels_per_template: 10

            # I think this was just for the wf overlay grid report...
            # but it may go in other place.
            # TODO: assess where else this type of upsampling might go.
            # Maybe just need to upsample after spikesorting.
            time_upsample:
              factor: 10
              method: sinc

          footprint_grids:
            circles_map_grid:
              output:
                write_pdf: false
                pdf_relpath: circles_map_grid.pdf
                write_png: true
                png_relpath: circles_map_grid.png
                write_svg: true
                svg_relpath: circles_map_grid.svg
                keep_temp_svg: false
                temp_svg_relpath: circles_map_grid__temp.svg
              display:
                show_title: false
              render:
                mode: direct_replot
                dpi: 420
                template: square
                global_color_scale: true # whether to use a global color scale across all units in the grid, or individual color scales per unit. Global color scale allows for better comparison of amplitude values across units, while individual color scales can enhance visibility of spatial patterns within each unit.
                subplot_background_color: black # background color for each subplot in the grid; separate from the color map background which is the default background color for the plot area behind the circles, which can be set in global_heatmap_defaults if desired.

            amplitude_map_grid:
              output:
                write_pdf: false
                pdf_relpath: amplitude_map_grid.pdf
                write_png: true
                png_relpath: amplitude_map_grid.png
                write_svg: true
                svg_relpath: amplitude_map_grid.svg
                keep_temp_svg: false
                temp_svg_relpath: amplitude_map_grid__temp.svg
              display:
                show_title: false
              render:
                mode: direct_replot
                dpi: 420
                template: square
                global_color_scale: true # whether to use a global color scale across all units in the grid, or individual color scales per unit. Global color scale allows for better comparison of amplitude values across units, while individual color scales can enhance visibility of spatial patterns within each unit.
                subplot_background_color: black # background color for each subplot in the grid; separate from the color map background which is the default background color for the plot area behind the circles, which can be set in global_heatmap_defaults if desired.

            latency_map_grid:
              output:
                write_pdf: false
                pdf_relpath: latency_map_grid.pdf
                write_png: true
                png_relpath: latency_map_grid.png
                write_svg: true
                svg_relpath: latency_map_grid.svg
                keep_temp_svg: false
                temp_svg_relpath: latency_map_grid__temp.svg
              display:
                show_title: false
              render:
                mode: direct_replot
                dpi: 420
                template: square
                global_color_scale: true # whether to use a global color scale across all units in the grid, or individual color scales per unit. Global color scale allows for better comparison of amplitude values across units, while individual color scales can enhance visibility of spatial patterns within each unit.
                subplot_background_color: black # background color for each subplot in the grid; separate from the color map background which is the default background color for the plot area behind the circles, which can be set in global_heatmap_defaults if desired.

  reconstruct:
    execution:
      debug: false
      force_restart: false
      force_replot: true
      force_replot_per_unit: false #TODO: Make sure this is wired up
      #unit_ids: [1, 3, 7, 10, 17, 20, 22, 23, 24, 28]
    resources:
      max_stage_workers: 4
      well_workers: 1
    unit_limit: 1000

    #av:

    reconstruct_with_axon_velocity: true
    axon_velocity:
      upsample: 1
      init_delay: 0
      # default: 3
      min_points_after_branching: 2
      # default: 100
      min_path_length: 17.5
      # default: 5
      min_path_points: 4
      # default: 0.5
      # max_peak_latency_for_splitting: 2.0
      # max_peak_latency_for_splitting: 0.5 # lower -> more aggressive splitting, higher -> less splitting; controls the maximum allowed latency of the peak channel in a branch for it to be eligible for splitting, which can help prevent over-splitting of branches with long propagation delays and/or low SNR peaks.
      max_peak_latency_for_splitting: .25 # lower -> more aggressive splitting, higher -> less splitting; controls the maximum allowed latency of the peak channel in a branch for it to be eligible for splitting, which can help prevent over-splitting of branches with long propagation delays and/or low SNR peaks.
      # default: 0.3
      kurt_threshold: -10.0
      peak_std_threshold: null
      peak_std_distance: 30
      # default: 3
      n_neighbors: 8
      # default: 2
      # distance_exp: 1
      distance_exp: 2
      # default: true
      remove_isolated: false
      detection_type: "relative" # "relative" or "absolute". relative means the detect_threshold is relative to the expected amplitude of the branch at that location, while absolute means the detect_threshold is an absolute value in microvolts.
      # default: 0.01
      detect_threshold: 0.0001
      # default: 30
      min_selected_points: 30
      #r2_threshold: 0.9
      r2_threshold: 0.85
      #max_distance_for_edge: 75
      max_distance_for_edge: 100
      max_distance_to_init: 200
      # default: 8
      mad_threshold: 10
      init_amp_peak_ratio: 0.2
      edge_dist_amp_ratio: 0.3
      r2_threshold_for_outliers: 0.98
      # default: 50
      # min_outlier_tracking_error: 200
      min_outlier_tracking_error: 50
      # default: 100
      # neighbor_radius: 50
      neighbor_radius: 100
      split_paths: true
      # default: 2000
      theilsen_maxiter: 8000

    inputs:
      load_assets_from_v2pipeline_templates_stage: true # whether to load templates stage outputs from the v2 pipeline output directory structure; if false, will attempt to load from the same directory structure as in the previous pipeline version, which may be useful for testing and comparison purposes.
    outputs:
      output_rel_root: recon_outputs
      reports:
        grids:
          sort_by: unit_id # unit_id, max_amplitude, max_ptp, or max_negative_peak, max_delay, template density
          circle_recon_grid:
            output:
              write_pdf: false
              pdf_relpath: reports/circle_recon_grid.pdf
              write_png: true
              png_relpath: reports/circle_recon_grid.png
              write_svg: true
              svg_relpath: reports/circle_recon_grid.svg
              keep_temp_svg: false
              temp_svg_relpath: reports/circle_recon_grid__temp.svg
            display:
              show_title: false
            render:
              mode: direct_replot
              dpi: 420
              subplot_background_color: black
              figure_background_color: black

      write_summary: false
      summary_relpath: summary.png
      write_report_md: false
      report_md_relpath: report.md

      per_unit_outputs:

        # Base rel dir for all outputs for a given unit. Can be formatted with {unit_id} if desired,
        # but should not include file name or extension components since those are specified separately for each output type below.
        unit_reldir: units/{unit_id:04d}/

        # JSON artifacts
        write_branches_raw_json: true
        branches_raw_relpath: branches_raw.json
        write_branches_json: true
        branches_relpath: branches.json
        write_heuristics_json: true
        heuristics_relpath: heuristics.json

        # GTR artifacts
        template_source: square # which template to use for GTR-based analyses and outputs; square, scan, or full.
        write_gtr_pkl: true
        gtr_pkl_relpath: gtr.pkl
        write_gtr_json: false
        gtr_json_relpath: gtr.json

        # Per-unit amplitude map (v2 shared heatmap path)
        write_amplitude_map_png: true
        amplitude_map_png_relpath: maps/amplitude_map.png
        amplitude_map:
          relpath: maps/amplitude_map
          panel_background_color: black
          color_bar:
            {}

        # Reconstruction Plots
        recon_plots:
          circle_recon:
            display:
              # TODO: Since we typically focus in on branches here instead of the channels
              # contributing to template, color bar needs to be adjusted so it dynamically
              # adjusts based on values in the xy scope after zooming in on branches and nodes.
              base: template_circles # which template plot to put branch morphology on top of; circles, amplitude_map, or latency_map.
              channel_scope: nodes_and_branches # zoom scope in on channels contributing to nodes and branches, which can help focus the plot on the relevant channels for the reconstruction; other options are contributing_channels, recorded_channels, or all_channels.
              zoom_padding_percent: 12 # extra padding around selected node/branch channels used to set circle_recon viewport.
              force_center_soma: true # force the soma to be centered in the template plot, even if the spatial distribution of the channels would suggest an off-center location.
              branch_scope: raw # raw or clean; whether to plot all branches in branches_raw or only the cleaned branches in branches.
              unique_color_per_branch: true # whether to use a unique color for each branch, which can help visually distinguish branches in complex reconstructions; if false, all branches will be the same color.
              show_branch_labels: false # whether to draw branch ID labels on the plot, which can be useful for visually verifying branch correspondences between the plot and the branch data in the JSON outputs.
              #color_scheme: tab20 # color scheme to use when unique_color_per_branch is true; should be a valid matplotlib categorical colormap name.
              color_scheme: Set1
              branch_linewidth_pt: 3.5
              node_inline_linewidth_pt: 1.0
              node_outline_color: white
              node_outline_linewidth: 0.5
              branch_outline_color: white
              branch_outline_linewidth: 0.5



            output:
              write_png: true
              write_svg: true
              relpath: circle_recon
              #dpi: 420
              dpi: 600

  analysis:
    execution:
      debug: false
      force_restart: false
      force_replot: false
    resources:
      max_stage_workers: 24
      well_workers: 1

    outputs:
      metrics:
        per_branch:
          reldir: branch_metrics/
          velocity: #compute velocity at each branch of each unit. Track in csv file.
            write_csv: true
            csv_relpath: branch_velocities.csv
          length:
            write_csv: true
            csv_relpath: branch_lengths.csv
          nodes:
            write_csv: true
            csv_relpath: branch_nodes.csv
          nodes_per_length:
            write_csv: true
            csv_relpath: branch_nodes_per_length.csv
          tortuosity: # compute tortuosity at each branch of each unit, defined as the path length divided by the Euclidean distance between the start and end nodes of the branch. Track in csv file.
            write_csv: true
            csv_relpath: branch_tortuosity.csv
        per_unit:
          reldir: unit_metrics/
          # Stats CSV convention for per-unit tables:
          # - one row per unit
          # - columns should include: n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95
          # - n: number of source samples used for that unit
          # - total: sum of source samples for that unit
          #
          # This collapses "mean/median/min/max/etc" style outputs into compact stats tables
          # instead of separate CSV files for each scalar.
          branch_length_stats:
            write_csv: true
            csv_relpath: branch_length_stats.csv
            source_level: per_branch
            source_metric: length
            columns: [n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95]
          branch_velocity_stats:
            write_csv: true
            csv_relpath: branch_velocity_stats.csv
            source_level: per_branch
            source_metric: velocity
            columns: [n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95]
          branch_tortuosity_stats:
            write_csv: true
            csv_relpath: branch_tortuosity_stats.csv
            source_level: per_branch
            source_metric: tortuosity
            columns: [n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95]
          branch_nodes_stats:
            write_csv: true
            csv_relpath: branch_nodes_stats.csv
            source_level: per_branch
            source_metric: nodes
            columns: [n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95]
          branch_nodes_per_length_stats:
            write_csv: true
            csv_relpath: branch_nodes_per_length_stats.csv
            source_level: per_branch
            source_metric: nodes_per_length
            columns: [n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95]

          # Keep explicit non-stat outputs separate for convenience and downstream joins.
          n_branches:
            write_csv: true
            csv_relpath: n_branches.csv
          sholl_analysis:
            write_csv: true
            csv_relpath: sholl_analysis.csv
          sholl_peak_intersections:
            write_csv: true
            csv_relpath: sholl_peak_intersections.csv
          sholl_critical_radius_um:
            write_csv: true
            csv_relpath: sholl_critical_radius_um.csv
          template_area:
            write_csv: true
            csv_relpath: template_area.csv
          template_channel_density:
            write_csv: true
            csv_relpath: template_channel_density.csv
          template_extent_x_um:
            write_csv: true
            csv_relpath: template_extent_x_um.csv
          template_extent_y_um:
            write_csv: true
            csv_relpath: template_extent_y_um.csv
          branch_points_per_100um:
            write_csv: true
            csv_relpath: branch_points_per_100um.csv
        per_well:
          reldir: well_metrics/
          # Per-well counters are kept as direct scalar CSV outputs.
          n_units_total:
            write_csv: true
            csv_relpath: n_units_total.csv
          n_units_reconstructed:
            write_csv: true
            csv_relpath: n_units_reconstructed.csv
          n_units_with_branches:
            write_csv: true
            csv_relpath: n_units_with_branches.csv
          frac_units_with_branches:
            write_csv: true
            csv_relpath: frac_units_with_branches.csv

          # Collapsed per-well stats CSVs computed from per-unit metrics.
          # Each row is a well, each table includes: n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95.
          # source_metric can point to a direct per-unit metric or a column from a per-unit stats table.
          branches_per_unit_stats:
            write_csv: true
            csv_relpath: branches_per_unit_stats.csv
            source_level: per_unit
            source_metric: n_branches
            columns: [n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95]
          branch_length_per_unit_stats:
            write_csv: true
            csv_relpath: branch_length_per_unit_stats.csv
            source_level: per_unit
            source_metric: branch_length_stats.total
            columns: [n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95]
          branch_velocity_per_unit_stats:
            write_csv: true
            csv_relpath: branch_velocity_per_unit_stats.csv
            source_level: per_unit
            source_metric: branch_velocity_stats.mean
            columns: [n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95]
          branch_tortuosity_per_unit_stats:
            write_csv: true
            csv_relpath: branch_tortuosity_per_unit_stats.csv
            source_level: per_unit
            source_metric: branch_tortuosity_stats.mean
            columns: [n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95]
          sholl_intersections_per_unit_stats:
            write_csv: true
            csv_relpath: sholl_intersections_per_unit_stats.csv
            source_level: per_unit
            source_metric: sholl_peak_intersections
            columns: [n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95]
          unit_locations:
            write_csv: true
            csv_relpath: unit_locations.csv
          unit_loc_density:
            write_csv: true
            csv_relpath: unit_location_density.csv
          template_area_per_unit_stats:
            write_csv: true
            csv_relpath: template_area_per_unit_stats.csv
            source_level: per_unit
            source_metric: template_area
            columns: [n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95]
          template_channel_density_per_unit_stats:
            write_csv: true
            csv_relpath: template_channel_density_per_unit_stats.csv
            source_level: per_unit
            source_metric: template_channel_density
            columns: [n, total, mean, median, min, max, std, sem, iqr, p05, p25, p75, p95]

          histograms:
            branch_velocity:
              write_png: true
              png_relpath: branch_velocity_histogram.png
              bin_size_ms: 0.05
              y_axis: unit_count # branch_count | unit_count
            total_branch_length:
              write_png: true
              png_relpath: total_branch_length_histogram.png
              bin_size_um: 100
              y_axis: unit_count # branch_count | unit_count
            longest_branch_length:
              write_png: true
              png_relpath: longest_branch_length_histogram.png
              bin_size_um: 50
              y_axis: unit_count # branch_count | unit_count
            longest_distance_from_soma:
              write_png: true
              png_relpath: longest_distance_from_soma_histogram.png
              bin_size_um: 50
              y_axis: unit_count # branch_count | unit_count
            longest_latency:
              write_png: true
              png_relpath: longest_latency_histogram.png
              bin_size_ms: 0.5
              y_axis: unit_count # branch_count | unit_count
            amplitude_at_soma:
              write_png: true
              png_relpath: amplitude_at_soma_histogram.png
              bin_size_uv: 100
              y_axis: unit_count # branch_count | unit_count

        cross_well:
          ordering: config # config | alphabetical
          plot_defaults:
            style: seaborn-v0_8-whitegrid
            dpi: 300
            fig_width_inches: 7.2
            fig_height_inches: 4.8
            title_fontsize: 11
            axis_label_fontsize: 10
            tick_label_fontsize: 9
            legend_fontsize: 9
            grid_alpha: 0.2
            show_unit_counts_on_x: true
            unit_count_label_format: "n={n}"
            rotate_xtick_labels_deg: 0
            tight_layout: true
            well_colors:
              well001: "tab:blue"
              well002: "tab:orange"
          statistical_testing:
            enable: true
            apply_to: both # box_and_whisker_plots | bar_plots | both
            paired_wells: false
            alpha: 0.05
            min_samples_per_well: 3
            nan_policy: omit # omit | propagate | raise
            normality_check:
              enable: true
              method: shapiro
              alpha: 0.05
            equal_variance_check:
              enable: true
              method: levene
              alpha: 0.05
            two_group_test:
              selection: auto # auto | welch_ttest | mannwhitneyu | permutation
              parametric: welch_ttest
              nonparametric: mannwhitneyu
              permutation_fallback:
                enable: true
                n_resamples: 10000
                random_seed: 1337
            multiple_testing_correction:
              enable: true
              method: holm # none | bonferroni | holm | fdr_bh
            effect_size:
              compute: true
              parametric_metric: cohens_d
              nonparametric_metric: cliffs_delta
            annotation:
              mark_on_plot: true
              mode: stars_and_pvalue # stars | pvalue | stars_and_pvalue
              hide_ns: false
              include_effect_size: true
              text_fontsize: 9
              bracket_linewidth: 1.0
              y_offset_fraction: 0.04
              star_thresholds:
                one_star_max_p: 0.05
                two_star_max_p: 0.01
                three_star_max_p: 0.001
                four_star_max_p: 0.0001
          box_and_whisker_plots:
            reldir: box_and_whisker_plots/
            defaults:
              write_png: true
              write_pdf: false
              show_points: true
              point_alpha: 0.45
              point_size: 18
              jitter: 0.08
              whisker_percentiles: [5, 95]
              show_notch: false
              use_log_y: false
            n_branches:
              source_level: per_unit
              source_metric: n_branches
              write_png: true
              png_relpath: n_branches_per_unit.png
              write_pdf: false
              pdf_relpath: n_branches_per_unit.pdf
              y_label: branches / unit
              title: Branch Count per Unit (by Well)
            total_branch_length:
              source_level: per_unit
              source_metric: branch_length_stats.total
              write_png: true
              png_relpath: total_branch_length_per_unit.png
              write_pdf: false
              pdf_relpath: total_branch_length_per_unit.pdf
              y_label: total branch length (um) / unit
              title: Total Branch Length per Unit (by Well)
            mean_branch_velocity:
              source_level: per_unit
              source_metric: branch_velocity_stats.mean
              write_png: true
              png_relpath: mean_branch_velocity_per_unit.png
              write_pdf: false
              pdf_relpath: mean_branch_velocity_per_unit.pdf
              y_label: mean branch velocity (um/ms) / unit
              title: Mean Branch Velocity per Unit (by Well)
            mean_branch_tortuosity:
              source_level: per_unit
              source_metric: branch_tortuosity_stats.mean
              write_png: true
              png_relpath: mean_branch_tortuosity_per_unit.png
              write_pdf: false
              pdf_relpath: mean_branch_tortuosity_per_unit.pdf
              y_label: mean branch tortuosity / unit
              title: Mean Branch Tortuosity per Unit (by Well)
            sholl_peak_intersections:
              source_level: per_unit
              source_metric: sholl_peak_intersections
              write_png: true
              png_relpath: sholl_peak_intersections_per_unit.png
              write_pdf: false
              pdf_relpath: sholl_peak_intersections_per_unit.pdf
              y_label: peak sholl intersections / unit
              title: Peak Sholl Intersections per Unit (by Well)
            template_area:
              source_level: per_unit
              source_metric: template_area
              write_png: true
              png_relpath: template_area_per_unit.png
              write_pdf: false
              pdf_relpath: template_area_per_unit.pdf
              y_label: template area (um^2) / unit
              title: Template Area per Unit (by Well)
            template_channel_density:
              source_level: per_unit
              source_metric: template_channel_density
              write_png: true
              png_relpath: template_channel_density_per_unit.png
              write_pdf: false
              pdf_relpath: template_channel_density_per_unit.pdf
              y_label: template channel density / unit
              title: Template Channel Density per Unit (by Well)
          bar_plots:
            reldir: bar_plots/
            defaults:
              write_png: true
              write_pdf: false
              # Bar plots are intentionally mean-focused for now (no median bar plots).
              aggregation: mean # mean | median
              error_bar: sem # none | sem | sd | ci95
              bar_width: 0.65
              capsize: 4
              annotate_values: true
              value_decimals: 2
              use_log_y: false
            n_units_reconstructed:
              source_level: per_well
              source_metric: n_units_reconstructed
              write_png: true
              png_relpath: n_units_reconstructed.png
              write_pdf: false
              pdf_relpath: n_units_reconstructed.pdf
              y_label: reconstructed units
              title: Reconstructed Units by Well
              stats:
                enable: false
            frac_units_with_branches:
              source_level: per_well
              source_metric: frac_units_with_branches
              write_png: true
              png_relpath: frac_units_with_branches.png
              write_pdf: false
              pdf_relpath: frac_units_with_branches.pdf
              y_label: fraction of units with branches
              title: Fraction of Units with Branches by Well
              stats:
                enable: false
            mean_branches_per_unit:
              source_level: per_well_stats
              source_metric: branches_per_unit_stats
              source_column: mean
              stats_source_level: per_unit
              stats_source_metric: n_branches
              write_png: true
              png_relpath: mean_branches_per_unit.png
              write_pdf: false
              pdf_relpath: mean_branches_per_unit.pdf
              y_label: mean branches / unit
              title: Mean Branches per Unit (by Well)
            mean_branch_length_per_unit:
              source_level: per_well_stats
              source_metric: branch_length_per_unit_stats
              source_column: mean
              stats_source_level: per_unit
              stats_source_metric: branch_length_stats.total
              write_png: true
              png_relpath: mean_branch_length_per_unit.png
              write_pdf: false
              pdf_relpath: mean_branch_length_per_unit.pdf
              y_label: mean total branch length (um) / unit
              title: Mean Branch Length per Unit (by Well)
            mean_branch_velocity_per_unit:
              source_level: per_well_stats
              source_metric: branch_velocity_per_unit_stats
              source_column: mean
              stats_source_level: per_unit
              stats_source_metric: branch_velocity_stats.mean
              write_png: true
              png_relpath: mean_branch_velocity_per_unit.png
              write_pdf: false
              pdf_relpath: mean_branch_velocity_per_unit.pdf
              y_label: mean branch velocity (um/ms) / unit
              title: Mean Branch Velocity per Unit (by Well)
            mean_branch_tortuosity_per_unit:
              source_level: per_well_stats
              source_metric: branch_tortuosity_per_unit_stats
              source_column: mean
              stats_source_level: per_unit
              stats_source_metric: branch_tortuosity_stats.mean
              write_png: true
              png_relpath: mean_branch_tortuosity_per_unit.png
              write_pdf: false
              pdf_relpath: mean_branch_tortuosity_per_unit.pdf
              y_label: mean branch tortuosity / unit
              title: Mean Branch Tortuosity per Unit (by Well)
            mean_sholl_intersections_per_unit:
              source_level: per_well_stats
              source_metric: sholl_intersections_per_unit_stats
              source_column: mean
              stats_source_level: per_unit
              stats_source_metric: sholl_peak_intersections
              write_png: true
              png_relpath: mean_sholl_intersections_per_unit.png
              write_pdf: false
              pdf_relpath: mean_sholl_intersections_per_unit.pdf
              y_label: mean sholl intersections / unit
              title: Mean Sholl Intersections per Unit (by Well)
            mean_template_area_per_unit:
              source_level: per_well_stats
              source_metric: template_area_per_unit_stats
              source_column: mean
              stats_source_level: per_unit
              stats_source_metric: template_area
              write_png: true
              png_relpath: mean_template_area_per_unit.png
              write_pdf: false
              pdf_relpath: mean_template_area_per_unit.pdf
              y_label: mean template area (um^2) / unit
              title: Mean Template Area per Unit (by Well)
            mean_template_channel_density_per_unit:
              source_level: per_well_stats
              source_metric: template_channel_density_per_unit_stats
              source_column: mean
              stats_source_level: per_unit
              stats_source_metric: template_channel_density
              write_png: true
              png_relpath: mean_template_channel_density_per_unit.png
              write_pdf: false
              pdf_relpath: mean_template_channel_density_per_unit.pdf
              y_label: mean template channel density / unit
              title: Mean Template Channel Density per Unit (by Well)

    ## Analysis stage updated to Pipeline V2 above this line. -------------------------

    prefer_curated_waveforms_panels: true
    botm:
      enable: false
      n_spike: 200
      n_noise: 2000
      seed: 0
      sorter: kilosort4
      channel_match_fraction_threshold: 0.7
      channel_match_prior_signal: 0.5
