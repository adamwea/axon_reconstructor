# Debug runtime configuration for axon reconstructor.
# This file is meant to be used in conjunction with debug.data.yml, which contains dataset-specific information.

# Data set config is seperated from runtime config.
data: ./debug.data.yml

env:
  python:
    # User-agnostic template path; ${HOME} expands per user.
    executable_path: ${HOME}/miniconda3/envs/axon_recon/bin/python
    # Preferred fallback when executable_path is absent on a machine.
    conda_env_name: axon_recon

resources:
  # Global fallbacks when a stage-specific resources block omits a key.
  max_workers: 24
  chunk_duration: 1s

stages:
  preprocess:
    execution:
      debug: false
      force_restart: false
      force_replot: false
    plot:
      segment_traces: false
    resources:
      max_stage_workers: 24
      well_workers: 2

  spikesort:
    execution:
      debug: false
      force_restart: false
      force_replot: false
    resources:
      max_stage_workers: 24
      well_workers: 2
      chunk_duration: 1s
    sorter: kilosort4
    docker_image: adammwea/benshalomlab_spikesorter_pythonpatch:v3
    resume_from: null
    #resume_from: merge
    rerun_analyzer: false
    curation: true
    auto_merge_units: false
    auto_merge_template_diff_thresh: 0.05,0.15,0.25
    kilosort:
      batch_duration_s: 0.75
      thresholds:
        universal: 8
        learned: 7
        single_ch: 5
      clustering:
        downsampling: 15
      channels:
        nearest: 12
        max_distance: 40
    unitmatch:
      merge_units: false
      dry_run: false
      output_subdir_name: unitmatch_outputs
      throughput_subdir_name: unitmatch_throughput
      max_spikes_per_unit: -1
      oversplit_min_probability: 0.95
      limits:
        # max_candidate_pairs: 20000
        # oversplit_max_suggestions: 2000
          max_candidate_pairs: -1
          oversplit_max_suggestions: -1
      apply_merges: true
      recursive: true
      iterations:
        #max: 5
        max: -1
        keep_all: true

  waveforms:
    execution:
      debug: false
      force_restart: false
      force_replot: false
    resources:
      max_stage_workers: 24
      well_workers: 2
    ms_before: 1
    ms_after: 2
    #max_spikes_per_unit: 1000000
    max_spikes_per_unit: -1
    per_segment: true
    per_segment_only_additional_channels: false
    filter_by_maxwell_epochs: false
    filter_by_segment_bounds: false
    prefer_merged_sorting: false
    merged_sorting_dir: null
    debug:
      max_units: null
      max_segments: null

  templates:
    execution:
      debug: false 
      force_restart: false
      force_replot: false
      force_replot_per_unit: false #TODO: Make sure this is wired up
    resources:
      max_stage_workers: 24
      well_workers: 2
    include_concat: true
    include_segments: true
    footprint_unit_limit: null
    templates_unit_limit: null
    top_channels_per_template: 10
    plot_grid_pdf: true
    plot_multi_source_pdf: true
    replot_from_disk: false
    require_curated_units: true
    time_upsample:
      factor: 10
      method: sinc

  reconstruct:
    execution:
      debug: false
      force_restart: false
      force_replot: true
      force_replot_per_unit: false #TODO: Make sure this is wired up
    resources:
      max_stage_workers: 8
      well_workers: 2
    unit_limit: 1000
    write_unit_pdfs: true
    write_all_units_overview_pdf: true
    write_top_density_grid: true
    top_n_density_requested: all
    templates_variant_name: null
    variant_name: null
    replot_top_density_grid_only: false
    show_density_scale_debug_text: false
    show_density_scale_global_debug_text: false
    show_density_scale_local_debug_text: false
    verbose: false
    write_template_movie_gif: false
    per_unit_outputs:
      # JSON artifacts
      write_branches_raw_json: true
      branches_raw_relpath: branches_raw.json
      write_branches_json: true
      branches_relpath: branches.json
      write_heuristics_json: true
      heuristics_relpath: heuristics.json

      # Template
      template:
        write_png: true
        write_svg: false
        relpath: template
        # Full-template channel scope:
        # - contributing_channels: only channels with non-zero template signal.
        # - recorded_channels: only channels that were actually recorded in the source data.
        # - all_channels: all channels present in full template locations - i.e. all channels physically present on the MEA regardless of whether they had signal or were recorded.
        channel_scope: contributing_channels
        background: black
        signal_color: white
        force_center_soma: false # force the soma to be centered in the template plot, even if the spatial distribution of the channels would suggest an off-center location.
        force_square_aspect: true # increase template plot size to make it square (with padding) regardless of the spatial distribution of the channels.
        show_scale_bar: true
        scale_bar_color: white

      # Amplitude Map
      amplitude_map:
        write_png: true
        write_svg: false
        relpath: amplitude_map
        # Plot style/layout controls.
        panel_background_color: black
        branch_color: red
        #branch_color: cyan
        branch_outline_color: white
        show_minimap: true # Basically just a square in a rectangle. small rectangle in the corner of each panel showing the full grid with the zoom range highlighted.
        minimap_position: topleft # topleft, topright, bottomleft, bottomright
        minimap_size: 0.4 # fraction of the panel size for the minimap
        minimap_outline_color: white
        minimap_chip_width_mm: 3.85
        minimap_chip_height_mm: 2.10
        minimap_inner_box_linestyle: solid # solid, dotted, dashed
        minimap_inner_box_linewidth: 0.6
        minimap_include_footprint: true # whether to show the footprint heatmap of the neuron in minimap
        #if true, check if any nodes or branches are occluded by the minimap and if so,
        # increase zoom span as needed to prevent occlusion. Only applies if show_minimap is true.
        minimap_prevent_occlusions: true
        # Extra data-space clearance around nodes/branches when testing minimap occlusion.
        minimap_clearance_um: 2.0
        # Additional display-space buffer added to branch stroke width during occlusion tests.
        minimap_linewidth_buffer_pt: 0.5
        # Iterative zoom expansion controls for minimap occlusion avoidance.
        minimap_occlusion_max_iters: 10
        minimap_occlusion_growth_factor: 1.15
        node_radius_um: 5
        soma_node_radius_um: 8
        soma_node_color: orange # e.g. cyan, yellow, magenta
        zoom_priority: "branches" # channels or branches. If channels, zoom range is determined by the channels contributing to the branch. If branches, zoom range is determined by the spatial extent of the branch itself (with some padding).
        zoom_padding_percent: 20 # percentage padding of selected zoom span (20 => 20%)
        # whether to force the grid to be centered on the soma.
        # e.g. if zoom_priority is "branches", while force_soma_centering is false, the grid will be zoomed to the branches.
        # however if force_soma_centering is true AND zoom_priority is "branches", the grid will be centered on the soma
        # and zoom span will increase as needed to include the branches (with zoom_padding_percent padding).
        # similar adjustments are made when zoom_priority is "channels" as needed and so long centering is possible
        # given the spatial distribution of the channels and branches.
        force_soma_centering: false
        soma_xy_coords: # print soma xy coordinates on the panel.
          show: true
          color: white
          fontsize: 6
          location: bottom left
      
      write_template_movie: false
      template_movie_relpath: template_movie.gif
      write_summary: false
      summary_relpath: summary.png
      write_summary_clean: false
      summary_clean_relpath: summary_clean.png
      write_summary_raw: false
      summary_raw_relpath: summary_raw.png

      # Maps
      write_amplitude_map_zoom: false
      amplitude_map_zoom_relpath: maps/amplitude_map_zoom.png
      write_peak_latency_map: false
      peak_latency_map_relpath: maps/peak_latency_map.png
      write_peak_latency_map_zoom: false
      peak_latency_map_zoom_relpath: maps/peak_latency_map_zoom.png
      write_peak_std_map: false
      peak_std_map_relpath: maps/peak_std_map.png
      write_peak_std_map_zoom: false
      peak_std_map_zoom_relpath: maps/peak_std_map_zoom.png
      write_channel_selection_detect: false
      channel_selection_detect_relpath: maps/channel_selection_detect.png
      write_channel_selection_kurt: false
      channel_selection_kurt_relpath: maps/channel_selection_kurt.png
      write_channel_selection_delay: false
      channel_selection_delay_relpath: maps/channel_selection_delay.png
      write_channel_selection_all: false
      channel_selection_all_relpath: maps/channel_selection_all.png

      # Graph views
      write_graph_nodes: false
      graph_nodes_relpath: maps/graph_nodes.png
      write_graph_edges: false
      graph_edges_relpath: maps/graph_edges.png
      write_graph_heuristics: false
      graph_heuristics_relpath: heuristics/graph_heuristics.png

      # Morphology
      write_morphology_pdf: false
      morphology_pdf_relpath: morphology/morphology.pdf
      write_morphology_zoom_pdf: false
      morphology_zoom_pdf_relpath: morphology/morphology_zoom.pdf

      # Branch plots
      write_branches_raw_clean_pdf: false
      branches_raw_clean_pdf_relpath: branches/raw/branches_raw_clean.pdf
      write_branches_raw_pdf: false
      branches_raw_pdf_relpath: branches/raw/branches_raw.pdf
      write_branches_raw_zoom_pdf: false
      branches_raw_zoom_pdf_relpath: branches/raw/branches_raw_zoom.pdf
      write_branches_clean_pdf: false
      branches_clean_pdf_relpath: branches/clean/branches_clean.pdf
      write_branches_clean_zoom_pdf: false
      branches_clean_zoom_pdf_relpath: branches/clean/branches_clean_zoom.pdf
      write_branch_velocities_pdf: false
      branch_velocities_pdf_relpath: branches/clean/branch_velocities.pdf
      write_branch_velocities_raw_overlay_pdf: false
      branch_velocities_raw_overlay_pdf_relpath: branches/raw/branch_velocities_overlay.pdf
      write_branch_velocities_overlay_pdf: false
      branch_velocities_overlay_pdf_relpath: branches/clean/branch_velocities_overlay.pdf
      write_branch_velocity_template: false
      branch_velocity_template_relpath: branches/clean/branch_{index:02d}_velocity
    grids:
      # Output folder inside reconstruction output dir.
      output_subdir: grids
      # Toggle file outputs independently.
      write_pdf: true
      write_png: true
      write_ranking_json: true
      # Basenames (no extension) for the two grid variants.
      log_basename: raw_branch_grid_log
      linear_basename: raw_branch_grid_linear
      ranking_filename: raw_branch_grid_ranking.json
      # Plot style/layout controls.
      ncols: 5
      dpi: 220
      draw_zoom_range_box: false
      panel_background_color: black
      branch_color: red
      #branch_color: cyan
      branch_outline_color: white
      show_unit_id_in_plot: true # top right corner of each panel
      unit_id_fontsize: 6
      unit_id_color: white
      show_minimap: true # Basically just a square in a rectangle. small rectangle in the corner of each panel showing the full grid with the zoom range highlighted.
      minimap_position: topleft # topleft, topright, bottomleft, bottomright
      minimap_size: 0.4 # fraction of the panel size for the minimap
      minimap_outline_color: white
      minimap_chip_width_mm: 3.85
      minimap_chip_height_mm: 2.10
      minimap_inner_box_linestyle: solid # solid, dotted, dashed
      minimap_inner_box_linewidth: 0.6
      minimap_include_footprint: true # whether to show the footprint heatmap of the neuron in minimap
      #if true, check if any nodes or branches are occluded by the minimap and if so,
      # increase zoom span as needed to prevent occlusion. Only applies if show_minimap is true.
      minimap_prevent_occlusions: true
      # Extra data-space clearance around nodes/branches when testing minimap occlusion.
      minimap_clearance_um: 2.0
      # Additional display-space buffer added to branch stroke width during occlusion tests.
      minimap_linewidth_buffer_pt: 0.5
      # Iterative zoom expansion controls for minimap occlusion avoidance.
      minimap_occlusion_max_iters: 10
      minimap_occlusion_growth_factor: 1.15
      node_radius_um: 5
      soma_node_radius_um: 8
      soma_node_color: orange # e.g. cyan, yellow, magenta
      zoom_priority: "branches" # channels or branches. If channels, zoom range is determined by the channels contributing to the branch. If branches, zoom range is determined by the spatial extent of the branch itself (with some padding).
      zoom_padding_percent: 20 # percentage padding of selected zoom span (20 => 20%)
      sort_by: "total_branch_length" # density
      # whether to force the grid to be centered on the soma.
      # e.g. if zoom_priority is "branches", while force_soma_centering is false, the grid will be zoomed to the branches.
      # however if force_soma_centering is true AND zoom_priority is "branches", the grid will be centered on the soma
      # and zoom span will increase as needed to include the branches (with zoom_padding_percent padding).
      # similar adjustments are made when zoom_priority is "channels" as needed and so long centering is possible
      # given the spatial distribution of the channels and branches.
      force_soma_centering: true
      soma_xy_coords: # print soma xy coordinates on the panel.
        show: true
        color: white
        fontsize: 6
        location: bottom left
      legend:
        show: true
        location: first_empty_panel # e.g. upper right, lower left, etc. or first_empty_panel to automatically place in the first empty panel starting from top left
        fontsize: 10
        fontcolor: black
        marker_size: 9
        show_nodes_in_legend: true
        show_footprint_in_legend: false # not even sure what this would look like. 

      # Extra logger output for candidate counts/selected units/path resolution.
      emit_debug_logs: false
    av:
      upsample: 1
      init_delay: 0
      # default: 3
      min_points_after_branching: 2
      # default: 100
      min_path_length: 17.5
      # default: 5
      min_path_points: 4
      # default: 0.5
      # max_peak_latency_for_splitting: 2.0
      max_peak_latency_for_splitting: 0.5
      # default: 0.3
      kurt_threshold: -10.0
      peak_std_threshold: null
      peak_std_distance: 30
      # default: 3
      n_neighbors: 8
      # default: 2
      # distance_exp: 1
      distance_exp: 2
      # default: true
      remove_isolated: false
      detection_type: "relative" # "relative" or "absolute". relative means the detect_threshold is relative to the expected amplitude of the branch at that location, while absolute means the detect_threshold is an absolute value in microvolts.
      # default: 0.01
      detect_threshold: 0.0001
      # default: 30
      min_selected_points: 30
      r2_threshold: 0.9
      max_distance_for_edge: 100
      max_distance_to_init: 200
      # default: 8
      mad_threshold: 10
      init_amp_peak_ratio: 0.2
      edge_dist_amp_ratio: 0.3
      r2_threshold_for_outliers: 0.98
      # default: 50
      # min_outlier_tracking_error: 200
      min_outlier_tracking_error: 50
      # default: 100
      # neighbor_radius: 50
      neighbor_radius: 100
      split_paths: true
      # default: 2000
      theilsen_maxiter: 8000

  analysis:
    execution:
      debug: false
      force_restart: false
      force_replot: false
    resources:
      max_stage_workers: 24
      well_workers: 1
    prefer_curated_waveforms_panels: true
    botm:
      enable: false
      n_spike: 200
      n_noise: 2000
      seed: 0
      sorter: kilosort4
      channel_match_fraction_threshold: 0.7
      channel_match_prior_signal: 0.5
