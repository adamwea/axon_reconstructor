output_root: /mnt/h/adamm/local_RBS_data/outputs
scratch_root: /home/adamm/dev/scratch_outputs
use_scratch_root: true
scratch_input_root: /home/adamm/dev/scratch_inputs
use_scratch_input_root: true
# When false, stage outputs stay on scratch and are not copied back to output_root.
publish_outputs: false
# When true and publish_outputs is true, publish uses move semantics and deletes scratch outputs after sync.
wipe_scratch_roots: false

#
analysis_name:

Probe: # https://www.mxwbio.com/products/maxtwo
  brand: maxwell
  device: maxtwo_HDMEA
  plate_format: 6-well
  # Per-well active sensing area (used for geometry-aware channel layout plotting).
  active_sensing_area_mm:
    x: 3.85
    y: 2.10
    z: null
  electrodes_per_well: 26400
  # Keep for future runtime checks and resampling defaults.
  sampling_rate_hz: 10000
  pitch_um: 17.5
  electrode_size_um:
    x: 12.0
    y: 8.8
    z: null

