# Default smoke-test configuration for NERSC Perlmutter.
#
# This file is committed and should contain safe defaults / placeholders.
# For machine- or user-specific paths (raw data, output roots, allocations),
# prefer putting overrides in:
#   tools/smoke_tests/perlmutter/smoke_tests.local.toml   (gitignored)
# or setting environment variables (which override both TOML files).

[paths]
# REQUIRED: Path to a Maxwell .raw.h5 input file.
raw_h5 = ""

# Recommended: an output root on pscratch.
# MEA_Analysis will create a structured tree under this root.
out_root = ""

# Optional: where your MEA_Analysis checkout lives.
mea_repo = ""

# Optional: where your axon_reconstructor checkout lives.
# If empty, the CLI will try to infer it from the current working tree.
axon_repo = ""

# Optional: Maxwell HDF5 plugin directory (for host-side reads).
# If empty, the bash config attempts to auto-detect common locations.
maxwell_hdf5_plugin_dir = ""

[run]
# Sorter name expected by MEA_Analysis pipeline.
sorter = "kilosort4"

# CPU workers. If empty, scripts fall back to SLURM_CPUS_PER_TASK or a small default.
n_jobs = 16

[shifter]
# Shifter image to use for GPU spikesorting on Perlmutter.
# Use fully-qualified image URIs (typically prefixed with "docker:").
image = "docker:adammwea/benshalomlab_spikesorter_shifter:v5"

# Force a container PATH to avoid host conda hijacking python.
container_path = "/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# Python executable inside the image.
python = "python3"

# Prefer using `srun shifter --image=...` (matches NERSC docs).
launch_mode = "shifter_cmd"

# Optional Shifter modules (site-specific). Leave empty for defaults.
modules = ""

[gpu_salloc]
# REQUIRED: project allocation/account for interactive GPU allocations.
account = ""
qos = "interactive"
constraint = "gpu"
time = "00:45:00"
nodes = 1
gpus = 1
cpus_per_task = 16

# Extra args appended verbatim to salloc (optional).
extra_args = ""

[mea_analysis]
# If running inside an image that auto-updates MEA_Analysis, these may be used.
repo_url = "https://github.com/roybens/MEA_Analysis.git"
branch = "dev_branch_aw_2"
