[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axon_recon"
version = "0.1.0"
description = "Axon reconstruction pipelines and utilities"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "rich>=15",
  "tqdm>=4",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.4",
]
# `full` is the production-grade runtime dep set — every pip dep that
# today lives across `environment.yml` (pip:) + the Dockerfile's
# `AXON_RECON_RUNTIME_SPEC` / SPIKEINTERFACE_SPEC / AXON_VELOCITY_SPEC /
# UNITMATCH_RUNTIME_SPEC / SLAY_RUNTIME_SPEC / MPI4PY_SPEC ARGs. Pinning
# here lets slice 3 of the env_install_unification_plan shrink
# environment.yml to conda-only with `- -e .[dev,full]`, and slice 6
# collapses the Dockerfile to `pip install -e .[full]`. Conda-installed
# packages (numpy, scipy, etc.) on the dev env path are not re-installed
# when pip sees them already satisfied. Version pins mirror the
# Dockerfile (production-tested).
#
# UnitMatchPy is fetched from its public GitHub upstream as a
# subdirectory of the parent UnitMatch repo. kssynth + unitlink stay off
# this list until their GH remotes exist (USER INJECTION #4 — hold).
full = [
  # Core scientific stack — pins from Dockerfile.
  "numpy<2.0",
  "h5py<4",
  "tqdm<5",
  "requests<3",
  "psutil",
  "matplotlib<4",
  "pandas<3.0",
  "pyarrow",
  "plotly>=5.18",
  "dash>=2.14",
  "dash-ag-grid",
  "statsmodels",
  "kaleido",
  "openpyxl",
  "scipy<2.0",
  "scikit-learn<2.0",
  "pyyaml",
  "docker",
  "pypdf",
  "nvidia-ml-py",
  # SpikeInterface + axon_velocity (dedicated ARGs in the Dockerfile).
  "spikeinterface==0.104.3",
  "axon_velocity==0.1.2",
  # MPI bindings.
  "mpi4py",
  # UnitMatchPy — sibling fetched from public upstream parent repo.
  # When pip resolves this transitively it pulls torch + the nvidia/*
  # CUDA wheel stack + triton (~5 GiB). For container builds on top of
  # `kilosort4-base:*_cuda-*` (which ships torch + nvidia/* pre-installed),
  # use the `full-cuda` extra below + a separate `--no-deps` install of
  # UnitMatchPy to skip that duplication.
  "UnitMatchPy @ git+https://github.com/EnnyvanBeest/UnitMatch.git#subdirectory=UnitMatchPy",
  # UMPy runtime deps (the Dockerfile installs these in
  # UNITMATCH_RUNTIME_SPEC; declaring here makes the conda env mirror
  # so `mat73` doesn't have to be installed manually after env create —
  # see USER INJECTION #1 history for the manual workaround).
  "mat73",
  "mtscomp",
  "joblib",
  # SLAy runtime dep (marshmallow is SLAy's only non-stdlib transitive dep).
  "marshmallow",
  # Siblings (DIRECTIVE D, 2026-05-19): SLAy + kssynth + unitlink now
  # ship from adamwea-owned GitHub remotes. SHAs pin to specific commits
  # for reproducibility:
  #   - SLAy pin = `f7c2173` (tip of `claude/merge-fixes-2026-05`, contains
  #     the unmerged merge-fixes PR https://github.com/adamwea/SLAy/pull/1).
  #     When the PR merges to main, repin to `origin/main` tip.
  #   - kssynth + unitlink pin to current `origin/main` (v1-feature-complete
  #     tips that were just published via inaugural `gh repo create`).
  "SLAy @ git+https://github.com/adamwea/SLAy.git@f7c2173ab9d3932c41da42edb8b39fd00a6f6b49",
  "kssynth @ git+https://github.com/adamwea/kssynth.git@5c02df36ec198ceca638cd716189d0689e77d20a",
  "unitlink @ git+https://github.com/adamwea/unitlink.git@c066a34ea5f2fbca8f47ee6d73946cf0c2a3e5d0",
]
# `full-cuda` is `full` MINUS the UnitMatchPy git URL pin. Use this
# extra inside a Dockerfile whose base image already ships torch +
# nvidia/* CUDA wheels + triton (e.g.
# `docker.io/spikeinterface/kilosort4-base:*_cuda-*`). The Dockerfile
# then runs a second `pip install --no-deps "UnitMatchPy @ git+..."`
# step to add UMPy without re-pulling its torch transitive deps.
#
# Saves ~5 GiB of duplication in the resulting container vs. using
# `[full]` directly. The conda-env install path (`pip install
# -e .[dev,full]`) keeps using `[full]` since the conda env doesn't
# preinstall torch.
full-cuda = [
  # Core scientific stack — pins from Dockerfile.
  "numpy<2.0",
  "h5py<4",
  "tqdm<5",
  "requests<3",
  "psutil",
  "matplotlib<4",
  "pandas<3.0",
  "pyarrow",
  "plotly>=5.18",
  "dash>=2.14",
  "dash-ag-grid",
  "statsmodels",
  "kaleido",
  "openpyxl",
  "scipy<2.0",
  "scikit-learn<2.0",
  "pyyaml",
  "docker",
  "pypdf",
  "nvidia-ml-py",
  "spikeinterface==0.104.3",
  "axon_velocity==0.1.2",
  "mpi4py",
  # UnitMatchPy is installed separately by the Dockerfile via
  # `pip install --no-deps` — see comment above.
  "mat73",
  "mtscomp",
  "joblib",
  "marshmallow",
  # Siblings (DIRECTIVE D, 2026-05-19): mirror the [full] pins exactly so
  # the conda env (which uses `[full]`) and the shifter image (which uses
  # `[full-cuda]`) ship identical sibling versions.
  "SLAy @ git+https://github.com/adamwea/SLAy.git@f7c2173ab9d3932c41da42edb8b39fd00a6f6b49",
  "kssynth @ git+https://github.com/adamwea/kssynth.git@5c02df36ec198ceca638cd716189d0689e77d20a",
  "unitlink @ git+https://github.com/adamwea/unitlink.git@c066a34ea5f2fbca8f47ee6d73946cf0c2a3e5d0",
]

[project.scripts]
axon-recon = "axon_recon.pipeline.cli:main"
axon-recon-container = "axon_recon.pipeline.container_cli:main"
axon-recon-dashboard = "axon_recon.dashboard.cli:entry_point"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src/axon_recon/pipeline"]
addopts = ["-q"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
