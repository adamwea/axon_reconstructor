name: axon_recon
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Developer convenience (no PyPI equivalent or pure-conda)
  - ipykernel
  - nodejs
  # Scientific stack — keep on conda for binary-friendly builds.
  # Version pins mirrored to pyproject.toml's [full] extra; conda
  # installs first so the pip step below sees these already satisfied
  # and is a no-op for them.
  - numpy
  - h5py
  - tqdm
  - requests
  - psutil
  - spikeinterface=0.104.3
  - matplotlib
  - pandas
  - pyarrow
  - plotly
  - dash
  - dash-ag-grid
  - statsmodels
  - kaleido
  - openpyxl
  - scipy
  - pyyaml
  # Everything else (pip-only deps + sibling editables + dev tooling)
  # lives in `pyproject.toml`'s [dev] + [full] extras. Single source of
  # truth per env_install_unification_plan slice 2.
  - pip:
      - -e .[dev,full]
