name: axon_recon
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - ipykernel
  - nodejs
  # Dev/test tooling
  - pytest
  - ruff
  - numpy
  - h5py
  - tqdm
  - requests
  - psutil
  - spikeinterface=0.104.3
  - matplotlib
  - pandas
  - pyarrow
  - openpyxl
  - scipy
  # - torch
  - pyyaml
  # Keep sibling editable repos out of the base env spec.
  # Install them after env creation with tools/bootstrap_editable_deps.sh.
  - pip:
      - docker
      - pypdf
      - -e .[dev]
