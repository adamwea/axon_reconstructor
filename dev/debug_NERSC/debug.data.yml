
# NERSC paths. Raw data lives directly on pscratch under
# /pscratch/sd/a/adammwea/raw_data/, so use_scratch_root is false (no copy-to-scratch
# step). Outputs also live on pscratch; long-term publish to CFS is a separate
# Globus step we are not wiring through publish_outputs for now.
output_root: /pscratch/sd/a/adammwea/analyzed_data/Media_Density_T5_02182026_AR_axon_analysis_AW
scratch_root: /pscratch/sd/a/adammwea/scratch

use_scratch_root: false

publish_outputs: false # When false, stage outputs stay on scratch and are not copied back to output_root.
wipe_scratch_roots: false # When true and publish_outputs is true, publish uses move semantics and deletes scratch outputs after sync.

