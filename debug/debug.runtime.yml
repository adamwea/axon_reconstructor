          n_jobs: 24
          template_extraction:
            seed: 0
            random_spikes_percentage: 25
            min_spikes_per_unit: 1000
            log_before_after_spike_counts: true
          sparsity:
            compute_sparsity: false
            method: best_channels
            num_channels: 300
            peak_sign: both
