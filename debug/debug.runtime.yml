              debug_json: true
              debug_json_relpath: unit_locations_highlight_linkage.json
            inherit_probe_dimensions: true
            zoom_to_affected_units: true
            label_pre_and_post_units: false
            assets:
              before:
                write_png: true
                write_svg: false
                relpath: unit_locations_before_merge.png
                point_color: "#7a7a7a"
              after:
                write_png: true
