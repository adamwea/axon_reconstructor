# Debug runtime configuration for axon reconstructor.
# This file is meant to be used in conjunction with debug.data.yml, which contains dataset-specific information.

# Data set config is seperated from runtime config.
data: ./debug.data.yml

env:
  python:
    # User-agnostic template path; ${HOME} expands per user.
    executable_path: ${HOME}/miniconda3/envs/axon_recon/bin/python
    # Preferred fallback when executable_path is absent on a machine.
    conda_env_name: axon_recon

resources:
  # Global fallbacks when a stage-specific resources block omits a key.
  # max_workers: 24
  chunk_duration: 1s
  max_simultaneous_well_reads_per_dataset: 1

global_logger:
  level: INFO
  format: "[%(asctime)s] %(levelname)s - %(message)s"
  debug_mode:
    enable: false
    level: DEBUG
    format: "[%(asctime)s] %(levelname)s - %(message)s (%(pathname)s:%(funcName)s:%(lineno)d)"

logging:
  enabled: true
  level: INFO
  console:
    enabled: true
    rich: true
    level: INFO
  structured:
    enabled: true
    path: logs/pipeline.jsonl
    level: INFO
  run_log:
    enabled: true
    path: logs/pipeline.log
    level: INFO
  error_log:
    enabled: true
    path: logs/errors.log
    level: WARNING
  dataset_logs:
    enabled: true
    level: INFO
  recording_logs:
    enabled: true
    level: INFO
  well_logs:
    enabled: true
    level: INFO
  phase_logs:
    enabled: true
    level: INFO
  summary:
    enabled: true
    path: logs/summary.json
  include_external_stdout: false
  include_external_stderr: false
  capture_warnings: true
  capture_uncaught_exceptions: true
  multiprocessing:
    enabled: true
    use_queue_listener: false

global_heatmap_defaults:
  # Shared defaults for heatmap-like plots across templates and reconstruct/recon.
  # Stage/output blocks can override any of these values and add plot-specific keys as needed.
  default:
    background: black
    color_map: viridis
    color_bar:
      show: true
      location: topright
      fontsize: 6
      fontcolor: white
      low_color: blue
      mid_color: white
      high_color: red
      length_fraction: 0.3
      pad_fraction: 0.02
      force_low_value: 0
      force_high_value: null
      scale: linear
      percentile_low: 5.0
      percentile_high_linear: 99.0
      percentile_high_log: 99.5
      knot_anchor_values: [1.0, 10.0]
      knot_y1_min: 0.02
      knot_y1_max: 0.90
      knot_y2_min: 0.07
      knot_y2_max: 0.98
      knot_min_gap: 0.05
      linear_cap_rounding_mode: ceil_step
      linear_cap_rounding_step: 10.0
      linear_cap_min_vmax: 11.0
      show_ticks: [1, 10, dynamic_high]

stages:

  preprocess:
    execution:
      force_restart: false
      force_replot: false
    logging:
      enabled: true
      verbose: true
      # Optional custom preprocess log path. Relative paths resolve under preprocess_outputs.
      file_relpath: logs/preprocess_pipeline.log
      # Suppress repetitive Neo Maxwell plugin status print (opt-in).
      suppress_h5_plugin_messages: true
      # Emit high-visibility phase divider lines in terminal and preprocess log.
      phase_dividers: true
    debug_mode:
      # Optional debug overrides for preprocess execution and outputs.
      #limit_wells: null # int or null for no limit
      #limit_segments_per_well: 2 # int or null for no limit
      #enabled: true
      #limit_segments_per_well: null
      #limit_datasets: 1
      #limit_wells: 1
      #limit_wells: null
      #limit_wells_per_dataset: 2
    observability:
      # off|basic|detailed; detailed captures richer metadata artifacts for debugging.
      mode: detailed
      output_subdir: run_metadata
      save_run_manifest: true
      save_event_timeline: true
      save_environment: true
      save_artifact_inventory: true
      save_stage_log: true
      stage_log_relpath: logs/preprocess_pipeline.log
    resources:
      #max_stage_workers: 24 # desktop
      max_stage_workers: 18 # lab server
      well_workers: 6 # number of wells to process in parallel; when combined with max_stage_workers, controls the effective n_jobs for preprocess phases that support it; keep at 1 for debugging iterations to simplify resource usage and make logs easier to follow, but can be set higher for faster iterations when well-level parallelism is not a concern.
      divide_stage_workers_by_wells: true # This controls the derived value of n_jobs. when true, stage workers are divided evenly among wells up to the max number of well workers.
    rel_output_root: preprocess_outputs # optional subdir under each well's output directory for all preprocess outputs; relative paths for preprocess phases resolve under this directory in each well's output directory
    #phase_sequence: [copy_src_to_scratch, save_rec_metadata, preprocess_segments, plot_segment_traces, plot_segment_channel_layouts, plot_raster_threshold]
    phase_sequence:
    - copy_src_to_scratch
    - save_rec_metadata
    - preprocess_segments
    #- plot_segment_traces
    #- plot_segment_channel_layouts
    #- concat_segments
    #- plot_concat_traces
    #- plot_concat_channel_layout
    #- plot_raster_threshold
    #- report_preprocessing
    #- cleanup_preprocessing_outputs
    #- wipe_src_scratch
    phases:
      copy_src_to_scratch:
        enabled: true
        requires_use_scratch_root: true
        summary_json_relpath: context/copy_src_to_scratch_summary.json

      save_rec_metadata:
        enabled: true
        verbose: true
        debug_mode:
          #enabled: true
          enabled: false
          limit_datasets: 1
          limit_wells: 3
          report_step_timers: true
        #metadata_source: source_h5
        metadata_source: scratch_h5 # use scratch H5 metadata as the source of truth for recording metadata during debugging iterations to validate the integrity of copied recordings and their metadata in scratch space; can be set to source_h5 to use source H5 metadata instead, which is faster to access and can be used when copy_src_to_scratch is false or not the focus of debugging iterations.
        summary_json_relpath: context/recording_metadata_summary.json
        segment_epochs_relpath: segment_epochs.json # start/stop timestamps for each segment; relative to preprocess output dir
        contiguous_epochs_relpath: contiguous_epochs.json # start/stop timestamps for contiguous data within each segment; relative to preprocess output dir
        sampling_metadata_relpath: sampling_metadata.json # per-segment sampling rate metadata; relative to preprocess output dir
        common_electrodes_relpath: common_electrodes.npy
        common_electrodes_summary_json_relpath: context/save_common_electrodes_summary.json

      prepare_raw_binaries:
        enabled: false
        summary_json_relpath: context/prepare_raw_binaries_summary.json
        rel_output_root: raw_binary_recording
        manifest_relpath: context/raw_binary_manifest.json
        outputs:
          save_chunk_duration: 1s
          save_progress_bar: true
          segment_save_n_jobs: null
          print_n_jobs_used: true

      preprocess_segments:
        enabled: true
        output_mode: lazy # lazy | binary; lazy mode saves per-segment preprocessed outputs in a way that supports lazy loading for downstream phases, while binary mode saves concatenated preprocessed outputs directly as memory-mapped binaries without intermediate per-segment files; keep lazy by default for debugging iterations to allow more granular inspection of per-segment preprocessing outputs, but can be set to binary to skip intermediate file saving and speed up iterations when segment-level inspection is not the focus.
        #lazy_source: src # src | scratch
        lazy_source: scratch # use scratch as the default lazy source for preprocess_segments to test lazy loading from scratch outputs during debugging iterations; can be set to src to test lazy loading directly from source recordings instead.
        rel_output_root: preprocessed_segments
        summary_json_relpath: context/segment_recordings_summary.json
        outputs:
          save_chunk_duration: 1s
          save_progress_bar: true
          segment_save_n_jobs: null
          print_n_jobs_used: true

      plot_segment_traces:
        enabled: false
        summary_json_relpath: context/plot_segment_traces_summary.json
        plot:
          # Master preprocess PNG diagnostics override.
          # true  -> force all preprocess PNG diagnostics OFF
          # false -> force all preprocess PNG diagnostics ON
          # null/omit -> respect individual toggles below
          disable_all_png_diagnostics: false

          # Individual diagnostic toggles for more granular control. These are all independent, so you can enable any combination of them.
          layouts: false
          segment_traces: true # legacy alias for per-segment enabled flag
          # Optional explicit output roots for preprocess diagnostics.
          # Relative paths resolve under the preprocess output directory.
          assay_stats_relpath: assay_stats_{stream_id}.txt
          channel_layouts_subdir: channel_layouts
          segment_traces_subdir: segment_traces
          # Representative controls for per-segment trace diagnostics.
          per_segment_traces:
            enabled: true
            # Alias-compatible with `n_representative_channels`; set to -1 to include all representatives.
            n_reps: 2
          # Parallel workers for diagnostic plotting/scoring (segment trace rendering + representative scoring).
          #n_jobs: null # inherit preprocess n_jobs by default; can set an explicit number here for more control.
          n_jobs: 1 # force one job at a time, probably better for read/write contention
          #well_workers: 1 # force one well at a time for the same reason

          # Downsample plotting density for concat/segment trace figures.
          # Example math (10 kHz source, 30 min recording):
          #   duration_s = 30 * 60 = 1800 s
          #   raw_points_per_channel = 10000 * 1800 = 18,000,000
          #   downsampled_points_per_channel = 250 * 1800 = 450,000
          #   decimation_factor = 10000 / 250 = 40x fewer samples
          #   reduction = 1 - (250 / 10000) = 97.5% fewer points
          # Effective plotting rate is capped further by trace_max_points.
          #trace_downsample_hz: 250.0
          #trace_downsample_hz: null # when null, no downsampling is applied to trace diagnostics; use with trace_max_points
          trace_downsample_hz: 100.0 # downsample to 100 Hz for trace diagnostics; effective rate may be further reduced by trace_max_points
          trace_max_points: -1 # int or -1 for no cap

      plot_segment_channel_layouts:
        enabled: false
        summary_json_relpath: context/plot_segment_channel_layouts_summary.json
        plot:
          layouts: true
          channel_layouts_subdir: channel_layouts

      concat_segments:
        enabled: false
        concatenate_preprocessed_recordings: true # when true, concatenate the preprocessed segment recordings; when false, concatenate raw segment recordings instead while keeping the rest of the concat phase wiring the same.
        debug_mode:
          enabled: false
          limit_datasets: 1
          limit_wells: 1
        output_mode: lazy
        summary_json_relpath: context/concat_segments_summary.json
        rel_output_root: concatenated_recording
        manifest_relpath: context/concat_segments_manifest.json
        outputs:
          save_chunk_duration: 1s
          save_progress_bar: true
          concat_save_n_jobs: null
          print_n_jobs_used: true

      plot_concat_traces:
        enabled: false
        summary_json_relpath: context/plot_concat_traces_summary.json
        plot:
          # Representative controls for concatenated trace diagnostics.
          concat_trace:
            enabled: true
            # Alias-compatible with `n_representative_channels`; set to -1 to include all representatives.
            n_reps: 3
          concat_trace_relpath: concat_cluster_reps_{stream_id}.png

      plot_concat_channel_layout:
        enabled: false
        summary_json_relpath: context/plot_concat_channel_layout_summary.json
        plot:
          layouts: true
          channel_layouts_subdir: channel_layouts

      plot_raster_threshold:
        enabled: false
        debug_mode:
          enabled: false
          #enabled: false
          limit_datasets: 1
          limit_wells: 1
          report_step_timers: false
        summary_json_relpath: context/plot_raster_threshold_summary.json
        rel_output_root: raster_threshold

      report_preprocessing:
        enabled: false
        summary_json_relpath: context/report_preprocessing_summary.json
        report_relpath: report/preprocessing_report.md
        json_summary_relpath: report/preprocessing_report.json

      cleanup_preprocessing_outputs:
        enabled: false
        summary_json_relpath: context/cleanup_preprocessing_outputs_summary.json

      wipe_src_scratch:
        enabled: false
        dry_run: true # when true, logs the paths that would be deleted without actually deleting them; keep true by default for safety during debugging iterations, but can be set to false to enable actual deletion of scratch outputs when publish_outputs is false and you want to clean up scratch space during debug runs.
        requires_use_scratch_root: true
        summary_json_relpath: context/wipe_src_scratch_summary.json

  spikesort:
    resources:
      max_stage_workers: 18
      well_workers: 2
      divide_stage_workers_by_wells: true # This controls the derived value of n_jobs. when true, stage workers are divided evenly among wells up to the max number of well workers.
      chunk_duration: 1s
    logging:
      enabled: true
      verbose: true
      file_relpath: logs/spikesort_pipeline.log
    debug_mode:
      enabled: true
      #limit_datasets: 2
      #limit_wells: 2
      #limit_wells: null
      limit_wells_per_dataset: 1

      # This option limits segments included in phases for quicker smoke testing.
      # - limit number of segments cocatenated in bootstrap_concat_binary.
      limit_segments: null

    execution:
      force_restart: false
      force_replot: false
      # Optional debug overrides for spikesort execution and outputs.
      # limit_wells: null # int or null for no limit
      # Relative paths resolve under the per-well output directory.
      output_root: spikesort_outputs # put all outputs during spikesort stage under this subdir in each well's output directory
      delete_outputs_on_force_restart: true # sort-phase cleanup toggle (alias for phases.sort.delete_outputs_on_force_restart). When force_restart is true, removes stale sort outputs under <well>/<output_root> (for example sorter_output and analyzer_output) before rerunning sort.

      # Optional checkpoint rewind stage in MEA_Analysis (e.g. merge).
      resume_from: null
      #resume_from: merge
    inputs:
      # Relative paths resolve under the per-well output directory.
      preprocess_concat_recording_relpath: preprocess_outputs/concatenated_recording
    #phase_sequence: [bootstrap_concat_binary, sort, bombcell_label, merge_SLAy, cleanup_concat_binary]
    phase_sequence: [bootstrap_concat_binary, sort, summarize_sort, bombcell_label, cleanup_concat_binary]
    phases:
      #resolve_sources:
      bootstrap_concat_binary:
        enabled: true
        debug_mode:
          enabled: false
          limit_datasets: 1
          limit_wells: 2
        # Source manifest is produced by preprocess.preprocess_segments; the binary cache is local to spikesort_outputs.
        source_segment_manifest_relpath: preprocess_outputs/preprocessed_segments/manifest.json
        cache_relpath: cache/bootstrap_concat_binary
        recording_relpath: cache/bootstrap_concat_binary/recording
        manifest_relpath: cache/bootstrap_concat_binary/concat_segments_manifest.json
        summary_json_relpath: cache/bootstrap_concat_binary/bootstrap_concat_binary_summary.json
        use_as_preprocess_concat_recording: true
        overwrite_existing: false
        overwrite_on_force_restart: true
        n_jobs: null
        chunk_duration: 1s
        progress_bar: true

      sort:
        enabled: true
        debug_mode:
          enabled: false
          limit_datasets: 1
          limit_wells: 2

        # source
        use_bootstrapped_concat_binary: true # when true, uses the output of the bootstrap_concat_binary phase as the source recording for sorting; when false, uses the original concatenated recording from preprocess outputs instead. Keep true by default to test the full pipeline from bootstrapped binary during debugging iterations, but can be set to false to skip the bootstrapped binary and use the original concatenated recording when the focus of debugging iterations is not on the bootstrapping phase.
        use_lazy_source: false # when true, uses the lazy loading mechanism for the source recording during sorting; when false, loads the source recording directly into memory for sorting. Keep false by default to avoid potential complications with lazy loading during debugging iterations, but can be set to true to test lazy loading during sorting when that is the focus of debugging iterations.
        assert_one_source: false # when true, asserts that there is exactly one valid source recording available for sorting; when false, allows multiple source recordings and relies on other logic to select the appropriate one. Keep true by default to enforce a clear source for sorting during debugging iterations, but can be set to false to allow more flexible source handling when the focus of debugging iterations is not on source selection.

        # Sorter Options
        sorter: kilosort4
        docker_image: adammwea/benshalomlab_spikesorter_pythonpatch:v3
        kilosort:
          batch_duration_s: 0.75
          thresholds:
            universal: 8
            learned: 7
            single_ch: 5
          clustering:
            downsampling: 15
          channels:
            nearest: 12
            max_distance: 40
        # Controls MEA_Analysis plotting behavior.
        plot:
          enabled: true
          mode: separate # separate|merged
          plot_debug: false
          raster_sort: null # e.g. unit_id|firing_rate or null
          fixed_y: false
        # Controls report/curation export behavior.
        report:
          enabled: true
          no_curation: true
          export_to_phy: false

      summarize_sort:
        enabled: false
        debug_mode:
          enabled: true
          limit_datasets: 1
          limit_wells: 2
        emit_logs: true
        generate_artifacts: false

      bombcell_label:
        enabled: true
        debug_mode:
          enabled: false
          limit_datasets: 1
          limit_wells: 2
        # outputs live under <well>/<spikesort_output_root>/<merge_units.rel_output_root>/<relpath>
        relpath: bombcell_label_outputs
        delete_outputs_on_force_restart: true

        # enable debugging and comparison.
        cache_sorter_output_before_analyzer_gen: true
        publish_cached_sorter_output_on_success: true
        publish_cached_analyzer_on_success: false # not sure this is needed.
        cleanup_on_success:
          analyzer: true # delete the Bombcell-local analyzer after labels and optional publish-back finish.
          cached_sorter_output: true # delete the Bombcell sorter-output cache after labels and optional publish-back finish.

        # analyzer
        analyzer:
          #regenerate_on_replot: false # when false, force_replot reuses an existing pre-merge workspace analyzer if present and only regenerates it when missing.
          regenerate_on_replot: false # when true, force_replot always regenerates the pre-merge workspace analyzer from the pre-merge workspace sorter output to ensure that merge reports reflect the current state of the pre-merge workspace, even if merge outputs are not being regenerated; keep false by default for faster iterations when merge debugging is not the focus, but can be set to true to ensure consistency between the pre-merge workspace and merge reports during debugging iterations that involve changes to the pre-merge workspace or its sorter output.
          check_if_regen_is_needed: true # when true, merge phase logic checks whether the pre-merge workspace analyzer needs to be regenerated based on the presence and freshness of an existing analyzer relative to the pre-merge workspace sorter output, and only regenerates the analyzer if needed; keep true by default to avoid unnecessary regenerations and speed up iterations when merge debugging is not the focus, but can be set to false to always regenerate the analyzer for consistency during debugging iterations that involve changes to the pre-merge workspace or its sorter output.
          #n_jobs: 1 # optional merge-only analyzer compute parallelism override for waveform/template/unit-location extensions and sparsity estimation. Omit to inherit stage-level n_jobs.
          #n_jobs: 24 # increase merge-side analyzer compute parallelism to speed up waveform/template/unit-location extensions and sparsity estimation during merge iterations, which can be computationally intensive; keep 1 by default for debugging iterations to simplify resource usage and make logs easier to follow, but can be set to a higher number for faster iterations when merge debugging is not the focus.
          #n_jobs: 32
          n_jobs: null # inherit stage-level n_jobs by default; can set an explicit number here for more control.
          #chunk_duration: 0.5s # optional merge-only analyzer compute chunking override. Omit to inherit stage-level chunk_duration.
          template_extraction:
            random_spikes_method: default # default|percentage|all. When random_spikes_percentage is set, default promotes to percentage automatically; "all" disables random spike subsampling entirely.
            #random_spikes_method: all # use all spikes for template-critical analyzer extensions during merge and in merge reports to ensure the most accurate templates for merge recommendations and reporting; keep default for faster iterations when merge debugging is not the focus.
            #max_spikes_per_unit: 500 # used when random_spikes_method stays sampled instead of "all".
            #max_spikes_per_unit: 1000 # keep a moderate cap on spikes per unit for template-critical analyzer extensions during merge and in merge reports to balance template quality with computational load during debugging iterations; can be set to a higher number or disabled entirely for more thorough template extraction in non-debug runs when computational load is less of a concern.
            max_spikes_per_unit: 500
            #max_spikes_per_unit: 500
            #max_spikes_per_unit: 5000 # increase max spikes per unit for template-critical analyzer extensions during merge and in merge reports to provide more comprehensive templates for merge recommendations and reporting; keep 500 by default for faster iterations when merge debugging is not the focus, but can be set to a higher number for more thorough template extraction in non-debug runs.
            #margin_size: 60 # optional border margin in samples for merge-side random spike selection.
            seed: 0 # optional seed for reproducible merge-side random spike selection.

            # custom density knobs
            #random_spikes_percentage: 25 # optional percentage of spikes per unit to use for template-critical analyzer extensions during merge and in merge reports; when combined with max_spikes_per_unit, the smaller cap wins. Use random_spikes_method: all to disable random spike subsampling entirely.
            #min_spikes_per_unit: 1000 # percentage-mode minimum selected-spike floor: if a unit has <= this many total spikes, use all eligible spikes; otherwise if eligible_spikes * random_spikes_percentage would fall below this number, raise the selected-spike count to this floor before applying any explicit max_spikes_per_unit cap; omit or set <= 0 to disable.
            #log_before_after_spike_counts: true # whether to log pre- and post-subsampling spike counts per unit for merge-side template-critical analyzer extensions to provide visibility into the effects of density controls during merge debugging iterations.

          sparsity:
            compute_sparsity: false # if false, force dense/all-channel merge analyzers and ignore sparsity-mask creation. If true, compute a sparsity mask using the method below and include only those channels in merge-side analyzers and merge reports.
            #method: radius # radius|best_channels|threshold|by_property. Ignored when compute_sparsity is false.
            #method: best_channels # use best_channels method for sparsity estimation to identify the most relevant channels for each unit based on their activity, which can improve the quality of merge recommendations by focusing on the channels that contribute most to each unit's signal; keep radius by default for debugging iterations to maintain a more inclusive channel selection that can provide additional context during early development stages.
            #radius_um: 100.0 # used by method=radius. Default matches SpikeInterface.
            #num_channels: 5 # used by method=best_channels. Default matches SpikeInterface.
            #num_channels: 300 # hacky way to just tell sorting analyzer that I want all channels.
            #num_channels: 300
            #threshold: 5.0 # used by method=threshold (SNR threshold). Default matches SpikeInterface.
            #peak_sign: neg # neg|pos|both. Default matches SpikeInterface.
            #peak_sign: both # include both negative and positive peaks when estimating sparsity for merge-side analyzers, which can provide a more comprehensive view of unit spatial footprints and improve merge recommendation quality; keep neg by default for debugging iterations to focus on negative peaks, which are more traditional for spike sorting and can simplify analysis during early debugging stages.
            #num_spikes_for_sparsity: 100 # optional spike cap used only while estimating merge-side sparsity. Default matches SpikeInterface.
            #by_property: group # used by method=by_property, for example on tetrodes.

          waveforms:
            #ms_before: 1.0 # optional merge-side waveform/template extraction window before each spike in ms.
            ms_before: 2.0 # increase pre-spike waveform extraction window to capture more of the spike waveform leading edge, which can be important for accurately characterizing units and improving merge recommendation quality; keep 1.0 ms by default for debugging iterations to reduce computational load and speed up iterations when merge debugging is not the focus, but can be set to a higher value for more thorough template extraction in non-debug runs.
            #ms_after: 2.0 # optional merge-side waveform/template extraction window after each spike in ms.
            ms_after: 5.0 # increase post-spike waveform extraction window to capture more of the spike waveform trailing edge, which can be important for accurately characterizing units and improving merge recommendation quality; keep 2.0 ms by default for debugging iterations to reduce computational load and speed up iterations when merge debugging is not the focus, but can be set to a higher value for more thorough template extraction in non-debug runs.
            #dtype: float32 # optional merge-side waveform dtype override for waveforms/templates/unit_locations dependencies.

        # Canonical Bombcell labeling function arguments.
        # Mirrors spikeinterface.curation.bombcell_label_units(...)
        params:
          label_non_somatic: true
          split_non_somatic_good_mua: true
          # optional: provide a custom thresholds dict or thresholds_path
          # thresholds: null
          # thresholds_path: null

        # write labels into the active sorter output; when the active sorter output is cached,
        # publish_cached_sorter_output_on_success controls whether that cache replaces canonical sorter_output.
        apply_to_sorter_output: true
        write_cluster_group: true
        # keep false for iterative debugging so merge can continue even if labeling fails
        fail_on_error: false

        reports:
          enabled: true
          # write a summary JSON with label counts and other relevant metadata.
          summary_json:
            enabled: true
            relpath: bombcell_label_summary.json

      merge_SLAy:

        enabled: false
        rel_output_root: merge_SLAy
        delete_outputs_on_force_restart: true
        force_restart: false
        force_replot: false

        debug_mode:
          enabled: true
          limit_datasets: 1
          limit_wells: 1

        # Work on a sorter-output copy so the stage's canonical sorter output is only
        # replaced after SLAy completes successfully. Analyzer outputs are not copied.
        working_cache:
          enabled: true
          relpath: cache/merge_workspace
          refresh_on_run: true
          assert_selected_sorter_output: true
          publish_to_canonical_on_success: false
          publish_to_canonical_on_failure: false

        cleanup_generated_analyzers_on_success: true

        analyzer:
          regenerate_on_replot: false
          check_if_regen_is_needed: true
          #n_jobs: 24
          n_jobs: null # inherit stage-level n_jobs by default; can set an explicit number here for more control.
          template_extraction:
            seed: 0
            #random_spikes_percentage: 25
            #min_spikes_per_unit: 1000
            max_spikes_per_unit: 100
            log_before_after_spike_counts: true
          sparsity:
            #compute_sparsity: false
            compute_sparsity: true
            #method: best_channels
            #num_channels: 300
            #peak_sign: both
            num_spikes_for_sparsity: 100
          waveforms:
            ms_before: 2.0
            ms_after: 5.0

        pre_merge_metadata:
          enabled: true
          write_json: true
          json_relpath: pre_merge_metadata_summary.json
          include_unit_locations: true
          log_summary_details: true

        post_merge_metadata:
          enabled: true
          write_json: true
