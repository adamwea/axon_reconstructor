        # I'd prefer to do something like this in the templates stage when we have the more fully formed templates to work with,
        # but this is a start and we can iterate on it.
        # TODO: this might be broken for now.
        template_diff_thresh: 0.05,0.15,0.25
        relpath: automerge_outputs
        delete_outputs_on_force_restart: true # merge-method cleanup toggle for auto_merge. When force_restart is true, removes only <well>/<output_root>/<auto_merge.relpath> before rerunning auto_merge.
        candidate_pairs_reldir: recommended_merge_candidates
        merged_units_reldir: merged_units
        # Note: This autoaccepts merges at each threshold level, so recommended merges may not clearly
        # describe the incremental effect of new merged templates appearing in the analyzer with each threshold auto_accepted
        # Use with caution for debugging and consider setting auto_accept_merges to false and inspecting candidate pairs manually in that case.
        auto_accept_merges: true # whether to automatically apply merges recommended by the spikeinterface automerge method, which can be a bit aggressive and lead to over-merging if left on without manual review, so keep false by default for debugging iterations.

