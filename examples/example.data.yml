# Example data configuration for axon_recon.
#
# This is a schema/documentation file. The paths below are placeholders
# (`/path/to/...`) and will not work as-is. Copy this file, point
# raw_data_h5_path entries at real `data.raw.h5` files, and tweak the
# probe / well / attributes blocks for your experiment.
#
# Real lab data configs live in debug_local/debug.data.yml and
# debug_NERSC/debug.data.yml. Production runtime configs reference those
# files via their `data:` key.

output_root: /path/to/analysis_outputs
scratch_root: /path/to/scratch
use_scratch_root: false

publish_outputs: false
wipe_scratch_roots: false

analysis_name: example_analysis

# Probe metadata used for chip-level plotting and channel layout.
# Defaults shown are for a Maxwell MaxTwo 6-well HD-MEA plate.
Probe:
  brand: maxwell
  device: maxtwo_HDMEA
  plate_format: 6-well
  chip_dimensions_um:
    x: 3850.0
    y: 2100.0
    z: null
  active_sensing_area_mm:
    x: 3.85
    y: 2.10
    z: null
  electrodes_per_well: 26400
  sampling_rate_hz: 10000
  pitch_um: 17.5
  electrode_size_um:
    x: 12.0
    y: 8.8
    z: null

# A dataset is a single Maxwell .raw.h5 recording. `wells` enumerates the
# wells on the plate; `attributes` records experimental conditions used for
# downstream filtering and grouping.
#
# Supported attribute keys (well-level; the analysis stage promotes them to
# parquet columns and the dashboard surfaces them as filter dropdowns):
#   - plating_density: int            (cells/well at plating, or null)
#   - media: str                      ("DMEM", "NBP", ...)
#   - genotype: str                   ("WT", "KO", ...)
#   - treatment: str | absent         (descriptive string; absent or null
#                                      means no treatment context. Use
#                                      specific names like "drug_X_post_2h"
#                                      when known, generic names like
#                                      "post_treatment_2h_unspecified" when
#                                      the treatment isn't documented yet.
#                                      Same value on every well of a chip
#                                      when the treatment is chip-level.)
#
# Custom keys are silently preserved in well_attributes manifests but won't
# be promoted to dashboard filters until they're added to runner.py's
# _UNITS_TABLE_COLUMNS and dashboard/app.py's filter wiring.
#
# include_in_runtime gates inclusion at both the dataset and well level so
# subsets can be re-run without editing dataset lists.
datasets:
  - raw_data_h5_path: /path/to/raw_data/experiment/yymmdd/CHIP_ID/AxonTracking/000001/data.raw.h5
    include_in_runtime: true
    DIV: 14
    wells:
      - well_id: well000
        include_in_runtime: true
        attributes:
          plating_density: 80000
          media: DMEM
          genotype: WT
          # treatment: drug_X_post_2h    # omit/null = no treatment context
